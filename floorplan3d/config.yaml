name: "3D Floorplan"
version: "0.2.0"
slug: floorplan3d
description: "Eigenen Grundriss zeichnen und Home-Assistant-Geräte in 3D platzieren"
url: "https://github.com/"
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:floor-plan
panel_title: "3D Floorplan"
panel_admin: false          # everyone may open the panel; who may EDIT is set with the option `editors`
homeassistant_api: true
map:
  - addon_config:rw
options:
  log_level: info
  editors: []
schema:
  log_level: list(debug|info|warning|error)?
  editors:
    - str?
