# The BETA: every merged version lands here. The normal add-on everybody has is floorplan3d-stable/ (tools/stable.py, workflow
# "Release to everyone"); it keeps the slug floorplan3d.
name: "3D Floorplan Beta"
version: "5.6.3"
slug: floorplan3d_beta
stage: experimental        # shown in the store only with Advanced mode (user profile)
description: "Beta: every new version at once, to test it before everyone gets it. More than a floor plan: your smart home in 3D. Lights, heating, energy, security, cameras and routines right where they are, with ready-made dashboard pages"
url: "https://github.com/BuRnEd4AiM/HA-Floorplanner"
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_stream: true       # the Supervisor passes a POST on instead of reading it first (its limit: 16 MB); a backup is larger (#693)
panel_icon: mdi:floor-plan
panel_title: "3D Floorplan Beta"
panel_admin: false          # everyone may open the panel; only administrators (and users in `editors`) may EDIT
homeassistant_api: true
map:
  - addon_config:rw
options:
  log_level: info
  editors: []
schema:
  log_level: list(debug|info|warning|error)?
  editors:
    - str?
