name: "3D Floorplan"
version: "3.19.1"
slug: floorplan3d
description: "Eigenen Grundriss zeichnen und Home-Assistant-Geräte in 3D platzieren"
url: "https://github.com/BuRnEd4AiM/HA-Floorplanner"
arch:
  - amd64
  - aarch64
init: false
ingress: true
panel_icon: mdi:floor-plan
panel_title: "3D Floorplan"
panel_admin: false          # everyone may open the panel; only administrators (and users in `editors`) may EDIT
homeassistant_api: true
map:
  - addon_config:rw
options:
  log_level: info
  editors: []
schema:
  log_level: list(debug|info|warning|error)?
  editors:
    - str?
