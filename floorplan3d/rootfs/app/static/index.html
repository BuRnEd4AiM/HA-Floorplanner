<!DOCTYPE html>
<html lang="de" data-theme="holo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Floorplan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="group" id="modeSwitch">
      <button data-mode="edit" class="active" data-i18n="mode.edit"></button>
      <button data-mode="live" data-i18n="mode.live" data-i18n-title="mode.liveTip"></button>
    </div>
    <div class="group edit-only" id="tools">
      <button data-tool="select" class="active" data-i18n="tool.select" data-i18n-title="tip.select"></button>
      <button data-tool="wall" data-i18n="tool.wall" data-i18n-title="tip.wall"></button>
      <button data-tool="room" data-i18n="tool.room" data-i18n-title="tip.room"></button>
      <button data-tool="block" data-i18n="tool.block" data-i18n-title="tip.block"></button>
      <button data-tool="stairs" data-i18n="tool.stairs" data-i18n-title="tip.stairs"></button>
      <button data-tool="opening" data-i18n="tool.opening" data-i18n-title="tip.opening"></button>
      <button data-tool="device" data-i18n="tool.device" data-i18n-title="tip.device"></button>
      <button data-tool="group" data-i18n="tool.group" data-i18n-title="tip.group"></button>
      <button data-tool="erase" data-i18n="tool.erase" data-i18n-title="tip.erase"></button>
    </div>
    <div class="group">
      <button id="view2d" data-i18n="view.2d"></button>
      <button id="view3d" class="active" data-i18n="view.3d"></button>
      <button id="viewSplit" data-i18n="view.split"></button>
      <button id="fitBtn" data-i18n="view.fit"></button>
    </div>
    <div class="group">
      <button id="addFloor" class="edit-only" data-i18n="floor.add"></button>
    </div>
    <div class="group" id="houseGroup" hidden>
      <select id="houseSelect" aria-label="House"></select>
    </div>
    <div class="group right">
      <span id="status"></span>
      <button id="saveBtn" class="primary edit-only" data-i18n="save"></button>
      <button id="settingsBtn" class="icon" data-i18n-title="settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main>
    <div id="stage">
      <canvas id="view"></canvas>
      <nav id="navBar">
        <div id="floorPills" class="pills"></div>
        <span class="sep" id="navSep"></span>
        <div id="roomPills" class="pills"></div>
        <span class="spacer"></span>
        <button id="houseToggle" class="pill" hidden></button>
        <button id="openPill" class="pill" hidden></button>
        <button id="autoToggle" class="pill" data-i18n="nav.auto" data-i18n-title="nav.autoTip"></button>
        <button id="wallToggle" class="pill"></button>
      </nav>
      <div id="modeBar"><button class="pill active" data-vm="normal">Normal</button><button class="pill" data-vm="temp">Temp.</button><button class="pill" data-vm="humid">Feuchte</button></div>
      <div id="livePopup" hidden></div>
      <aside id="roomPanel" hidden></aside>
    </div>

    <div id="panelResizer" role="separator" aria-orientation="vertical" data-i18n-title="panel.resize"></div>
    <aside id="panel">
      <section id="hint">
        <h3 data-i18n="panel.hint"></h3>
        <p id="hintText"></p>
      </section>

      <details id="housePanel" class="edit-only">
        <summary data-i18n="house.panel"></summary>
        <div id="houseBody"></div>
        <h4 data-i18n="backup.title"></h4>
        <p class="sub" data-i18n="backup.hint"></p>
        <div class="stopTools">
          <a id="backupExport" class="btn" href="api/backup" download data-i18n="backup.export"></a>
          <button type="button" id="backupImport" data-i18n="backup.import"></button>
          <input type="file" id="backupFile" accept=".json,application/json" hidden>
        </div>
        <h4 data-i18n="imp.section"></h4>
        <p class="sub" data-i18n="imp.sectionHint"></p>
        <div class="stopTools">
          <button type="button" id="importOpen" data-i18n="imp.open"></button>
          <button type="button" id="propExport" data-i18n="imp.exportProp"></button>
        </div>
      </details>

      <details id="floorPanel" class="edit-only">
        <summary data-i18n="floor.panel"></summary>
        <div id="floorBody"></div>
      </details>

      <details id="bgPanel" class="edit-only">
        <summary data-i18n="bg.title"></summary>
        <div id="bgBody"></div>
      </details>

      <section id="devicePalette" hidden>
        <h3 data-i18n="panel.deviceType"></h3>
        <input id="paletteSearch" type="search" data-i18n-placeholder="pal.search">
        <div id="paletteCats"></div>
        <div id="paletteGrid" class="palette thumbs"></div>
        <h3 data-i18n="panel.models"></h3>
        <div id="modelGrid" class="palette"></div>
        <label class="uploadBtn"><span data-i18n="panel.upload"></span>
          <input id="modelFile" type="file" accept=".glb,model/gltf-binary" hidden>
        </label>
        <h3 data-i18n="panel.entity"></h3>
        <input id="entitySearch" type="search" data-i18n-placeholder="panel.entitySearch">
        <select id="entitySelect" size="6"></select>
      </section>

      <section id="groupPalette" hidden>
        <h3 data-i18n="tool.group"></h3>
        <div id="groupBody"></div>
      </section>

      <section id="blockPalette" hidden>
        <h3 data-i18n="block.title"></h3>
        <div class="prop"><label for="blockFloor" data-i18n="block.belongsTo"></label>
          <select id="blockFloor"><option value="below" data-i18n="block.below"></option><option value="this" data-i18n="block.this"></option></select></div>
        <p class="sub" data-i18n="block.help"></p>
      </section>

      <section id="stairPalette" hidden>
        <h3 data-i18n="stair.title"></h3>
        <div class="palette" id="stairTypes">
          <button data-stair="straight" class="active" data-i18n="stair.straight"></button>
          <button data-stair="L" data-i18n="stair.L"></button>
          <button data-stair="U" data-i18n="stair.U"></button>
          <button data-stair="spiral" data-i18n="stair.spiral"></button>
          <button data-stair="shaft" data-i18n="stair.shaft"></button>
        </div>
        <div class="prop"><label for="stairDir" data-i18n="stair.dir"></label>
          <select id="stairDir"><option value="up" data-i18n="stair.up"></option><option value="down" data-i18n="stair.down"></option></select></div>
        <div class="prop"><label for="stairTurn" data-i18n="stair.turn"></label>
          <select id="stairTurn"><option value="right" data-i18n="stair.right"></option><option value="left" data-i18n="stair.left"></option></select></div>
        <div class="prop"><label for="stairRot" data-i18n="prop.rotation"></label><input id="stairRot" type="number" step="15" value="0"></div>
        <p class="sub" data-i18n="stair.help2"></p>
      </section>

      <section id="openingPalette" hidden>
        <h3 data-i18n="panel.openingType"></h3>
        <div class="palette">
          <button data-opening="door" class="active" data-i18n="op.door"></button>
          <button data-opening="doorEntry" data-i18n="op.doorEntry"></button>
          <button data-opening="doorGlass" data-i18n="op.doorGlass"></button>
          <button data-opening="doorDouble" data-i18n="op.doorDouble"></button>
          <button data-opening="doorSlide" data-i18n="op.doorSlide"></button>
          <button data-opening="doorOpen" data-i18n="op.doorOpen"></button>
          <button data-opening="window" data-i18n="op.window"></button>
          <button data-opening="window2" data-i18n="op.window2"></button>
          <button data-opening="window3" data-i18n="op.window3"></button>
          <button data-opening="windowTall" data-i18n="op.windowTall"></button>
          <button data-opening="windowBath" data-i18n="op.windowBath"></button>
          <button data-opening="windowFixed" data-i18n="op.windowFixed"></button>
        </div>
      </section>

      <section id="objList" hidden>
        <h3 data-i18n="panel.objects"></h3>
        <div id="objListBody"></div>
      </section>

      <section id="props" hidden>
        <h3 id="propsTitle"></h3>
        <div id="propsBody"></div>
      </section>

      <section id="controlsHelp">
        <h3 data-i18n="panel.controls"></h3>
        <ul class="keys">
          <li data-i18n="keys.rotate"></li>
          <li data-i18n="keys.pan"></li>
          <li data-i18n="keys.zoom"></li>
          <li data-i18n="keys.qe"></li>
          <li data-i18n="keys.del"></li>
          <li data-i18n="keys.esc"></li>
          <li data-i18n="keys.undo"></li>
        </ul>
      </section>
    </aside>
  </main>
</div>

<dialog id="importDialog">
  <form method="dialog" novalidate>
    <div class="dlgHead"><h2 data-i18n="imp.title"></h2><button type="submit" class="dlgClose" formnovalidate aria-label="Close" data-i18n-title="close">✕</button></div>
    <p class="sub" data-i18n="imp.hint"></p>
    <div class="impBar">
      <label class="btn"><span data-i18n="imp.file"></span><input type="file" id="importFile" accept=".json,.geojson,application/json" hidden></label>
      <button type="button" id="importExFlat" data-i18n="imp.exFlat"></button>
      <button type="button" id="importExHouse" data-i18n="imp.exHouse"></button>
      <button type="button" id="importPrompt" data-i18n="imp.prompt"></button>
    </div>
    <textarea id="importText" spellcheck="false" data-i18n-placeholder="imp.placeholder"></textarea>
    <input type="text" id="importName" data-i18n-placeholder="imp.name">
    <div id="importResult"></div>
    <div class="impFoot">
      <button type="button" id="importCheck" data-i18n="imp.check"></button>
      <button type="button" id="importRun" class="primary" disabled data-i18n="imp.run"></button>
    </div>
  </form>
</dialog>

<dialog id="settingsDialog">
  <form method="dialog" novalidate>
    <div class="dlgHead"><h2 data-i18n="settings"></h2><button type="submit" class="dlgClose" formnovalidate aria-label="Close" data-i18n-title="close">✕</button></div>

    <h3 data-i18n="set.section.general"></h3>
    <div class="row"><label for="setLanguage" data-i18n="set.language"></label>
      <select id="setLanguage"><option value="de">Deutsch</option><option value="en">English</option></select></div>
    <div class="row"><label for="setTheme" data-i18n="set.theme"></label>
      <select id="setTheme"><option value="holo" data-i18n="set.theme.holo"></option><option value="dark" data-i18n="set.theme.dark"></option><option value="light" data-i18n="set.theme.light"></option></select></div>
    <div class="row"><label for="setUnits" data-i18n="set.units"></label>
      <select id="setUnits"><option value="metric" data-i18n="set.units.metric"></option><option value="imperial" data-i18n="set.units.imperial"></option></select></div>

    <h3 data-i18n="set.section.drawing"></h3>
    <div class="row"><label for="setGrid" data-i18n="set.grid"></label>
      <select id="setGrid"><option value="0.05">5 cm</option><option value="0.1">10 cm</option><option value="0.25">25 cm</option><option value="0.5">50 cm</option><option value="1">1 m</option></select></div>
    <div class="row"><label for="setWallHeight" data-i18n="set.wallHeight"></label>
      <input id="setWallHeight" type="number" step="any"></div>
    <div class="row"><label for="setWallThickness" data-i18n="set.wallThickness"></label>
      <input id="setWallThickness" type="number" step="any"></div>
    <div class="row"><label for="setAutosave" data-i18n="set.autosave"></label>
      <input id="setAutosave" type="number" step="any"></div>

    <h3 data-i18n="set.section.view"></h3>
    <div class="row check"><input id="setShadows" type="checkbox"><label for="setShadows" data-i18n="set.shadows"></label></div>
    <div class="row check"><input id="setLabels" type="checkbox"><label for="setLabels" data-i18n="set.labels"></label></div>
    <div class="row check"><input id="setWallStop" type="checkbox"><label for="setWallStop" data-i18n="set.wallStop"></label></div>
    <div class="row check"><input id="setCutaway" type="checkbox"><label for="setCutaway" data-i18n="set.cutaway"></label></div>
    <div class="row check"><input id="setLowWalls" type="checkbox"><label for="setLowWalls" data-i18n="set.lowWalls"></label></div>

    <h3 data-i18n="set.section.tablets"></h3>
    <p class="hint" data-i18n="set.tabletHelp"></p>
    <datalist id="haUsers"></datalist>
    <div id="tabletRows"></div>
    <div class="stopTools"><button type="button" id="addTablet" data-i18n="set.addTablet"></button></div>

    <h3 data-i18n="set.section.look"></h3>
    <div class="row"><label for="setWallOpacity" data-i18n="set.wallOpacity"></label><input id="setWallOpacity" type="number" step="any" min="0.2" max="1"></div>
    <div class="row"><label for="setBelow" data-i18n="set.below"></label><input id="setBelow" type="number" step="any" min="0.05" max="1"></div>
    <div class="row"><label for="setGlowRadius" data-i18n="set.glowRadius"></label><input id="setGlowRadius" type="number" step="any"></div>
    <div class="row"><label for="setGlowStrength" data-i18n="set.glowStrength"></label><input id="setGlowStrength" type="number" step="any"></div>
    <div class="row"><label for="setGlowHeight" data-i18n="set.glowHeight"></label><input id="setGlowHeight" type="number" step="any"></div>
    <div class="row"><label for="setDefaultLight" data-i18n="set.defaultLight"></label><input id="setDefaultLight" type="color"></div>
    <div class="row"><label for="setBgTop" data-i18n="set.bgTop"></label><input id="setBgTop" type="color"></div>
    <div class="row"><label for="setBgBottom" data-i18n="set.bgBottom"></label><input id="setBgBottom" type="color"></div>
    <div class="row"><label for="setBgGlow" data-i18n="set.bgGlow"></label><input id="setBgGlow" type="color"></div>

    <h3 data-i18n="set.section.tempColors"></h3>
    <div id="tempStops" class="stops"></div>
    <h3 data-i18n="set.section.humidColors"></h3>
    <div id="humidStops" class="stops"></div>

    <menu><button value="close" class="primary" data-i18n="close"></button></menu>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
