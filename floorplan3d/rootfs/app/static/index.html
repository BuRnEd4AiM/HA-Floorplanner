<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
  <link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Floorplan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nightDim" hidden></div>
<div id="app">
  <header id="toolbar">
    <div class="group" id="modeSwitch">
      <button data-mode="edit" class="active" data-i18n="mode.edit"></button>
      <button data-mode="live" data-i18n="mode.live" data-i18n-title="mode.liveTip"></button>
    </div>
    <div class="group edit-only" id="tools">
      <button data-tool="select" class="active" data-i18n-title="tip.select"><span class="tLabel" data-i18n="tool.select"></span></button>
      <button data-tool="wall" data-i18n-title="tip.wall"><span class="tLabel" data-i18n="tool.wall"></span></button>
      <button data-tool="room" data-i18n-title="tip.room"><span class="tLabel" data-i18n="tool.room"></span></button>
      <button id="autoRooms" data-i18n-title="tip.autoRooms" data-full="tool.autoRooms"><span class="tLabel" data-i18n="tool.s.autoRooms"></span></button>
      <button data-tool="block" data-i18n-title="tip.block"><span class="tLabel" data-i18n="tool.block"></span></button>
      <button data-tool="plot" data-i18n-title="tip.plot"><span class="tLabel" data-i18n="tool.plot"></span></button>
      <button data-tool="stairs" data-i18n-title="tip.stairs"><span class="tLabel" data-i18n="tool.stairs"></span></button>
      <button data-tool="hole" data-i18n-title="tip.hole" data-full="tool.hole"><span class="tLabel" data-i18n="tool.s.hole"></span></button>
      <button data-tool="opening" data-i18n-title="tip.opening"><span class="tLabel" data-i18n="tool.opening"></span></button>
      <button data-tool="device" data-i18n-title="tip.device"><span class="tLabel" data-i18n="tool.device"></span></button>
      <button data-tool="measure" data-i18n-title="tip.measure"><span class="tLabel" data-i18n="tool.measure"></span></button>
      <button data-tool="erase" data-i18n-title="tip.erase"><span class="tLabel" data-i18n="tool.erase"></span></button>
      <button id="powerEditBtn" type="button" data-i18n-title="tip.power" data-full="tool.power"><span class="tLabel" data-i18n="tool.s.power"></span></button>
      <button id="cableBtn" data-tool="cable" type="button" hidden data-i18n-title="tip.cable"><span class="tLabel" data-i18n="tool.cable"></span></button>
      <button id="energyBtn" type="button" hidden data-i18n-title="tip.energy" data-full="tool.energy"><span class="tLabel" data-i18n="tool.s.energy"></span></button>
      <button id="dormerBtn" type="button" data-i18n-title="tip.dormer"><span class="tLabel" data-i18n="tool.dormer"></span></button>
      <button id="importBtn" type="button" data-i18n-title="tip.import" data-full="tool.import"><span class="tLabel" data-i18n="tool.s.import"></span></button>
      <button id="toolsMoreBtn" type="button" hidden aria-haspopup="true" aria-expanded="false" data-i18n-title="tip.more" data-full="tool.more"><span class="tLabel" data-i18n="tool.s.more"></span></button>
      <div id="toolsMore" hidden></div>
      <button id="toolsEditBtn" type="button" class="icon" data-i18n-title="tbar.edit" aria-label="Customise tools">✎</button>
    </div>
    <div class="group">
      <button id="view2d" data-i18n="view.2d"></button>
      <button id="view3d" class="active" data-i18n="view.3d"></button>
      <button id="viewSplit" data-i18n="view.split"></button>
      <button id="fitBtn" data-i18n="view.fit"></button>
    </div>
    <div class="group">
      <button id="addFloor" class="edit-only" data-i18n="floor.add"></button>
    </div>
    <div class="group" id="houseGroup" hidden>
      <select id="houseSelect" aria-label="House"></select>
    </div>
    <div class="group" id="buildingGroup" hidden>
      <select id="buildingSelect" aria-label="Building" data-i18n-title="bld.switchTip"></select>
    </div>
    <div class="group right">
      <span id="status"></span>
      <button id="versionPill" class="pill ver-wait" type="button" hidden></button>
      <button id="backupBtn" class="admin-only" data-i18n="bk.btn" data-i18n-title="bk.tip"></button>
      <button id="undoBtn" class="icon edit-only" type="button" disabled data-i18n-title="tip.undo" aria-label="Undo">↶</button>
      <button id="redoBtn" class="icon edit-only" type="button" disabled data-i18n-title="tip.redo" aria-label="Redo">↷</button>
      <button id="saveBtn" class="primary edit-only" data-i18n="save"></button>
      <button id="settingsBtn" class="icon" data-i18n-title="settings" aria-label="Settings">⚙</button>
      <button id="logoutBtn" type="button" data-i18n="login.out" hidden></button>
    </div>
  </header>

  <main>
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="wxFall" hidden><i></i></div>
      <div id="tabPages" hidden><section class="tabPage" data-page="today" hidden></section><section class="tabPage" data-page="energy" hidden></section><section class="tabPage" data-page="climate" hidden></section><section class="tabPage" data-page="cameras" hidden></section><section class="tabPage" data-page="media" hidden></section><section class="tabPage" data-page="household" hidden></section><section class="tabPage" data-page="routines" hidden></section><section class="tabPage" data-page="family" hidden></section></div>
      <div id="welcome" hidden>
        <button id="welClose" type="button" class="dlgClose" aria-label="Close" data-i18n-title="close">✕</button>
        <h2 data-i18n="wel.title"></h2>
        <p data-i18n="wel.text"></p>
        <div class="welBtns">
          <button id="welDraw" type="button" class="primary" data-i18n="wel.draw"></button>
          <button id="welExample" type="button" data-i18n="wel.example"></button>
          <button id="welImport" type="button" data-i18n="wel.import"></button>
        </div>
      </div>
      <nav id="navBar">
        <div id="floorPills" class="pills"></div>
        <span class="sep" id="navSep"></span>
        <div id="roomPills" class="pills"><button id="roomMenuBtn" class="pill" type="button" hidden aria-haspopup="true" aria-expanded="false" data-i18n-title="nav.roomsTip"></button></div>
        <button id="energyPill" class="pill" hidden type="button"></button>
        <span id="meterPill" class="pill" hidden></span>
        <span class="spacer"></span>
        <button id="guardBtn" class="pill" hidden type="button" data-i18n-title="gd.btnTip"></button>
        <button id="houseToggle" class="pill" hidden></button>
        <button id="lightsPill" class="pill" hidden type="button" aria-haspopup="true" aria-expanded="false"></button>
        <button id="devicesPill" class="pill" hidden type="button" aria-expanded="false" data-i18n-title="dl.tip"></button>
        <button id="offlinePill" class="pill" hidden data-i18n-title="off.tip"></button>
        <button id="openPill" class="pill" hidden></button>
        <button id="camPill" class="pill" hidden data-i18n-title="cam.pillTip"></button>
      </nav>
      <div id="roomMenu" hidden></div>
      <div id="lightsMenu" hidden></div>
      <div id="camMenu" hidden>
        <p class="sub" data-i18n="cam.hint"></p>
        <div id="camGrid"></div>
      </div>
      <div id="viewMenu" hidden>
        <button id="autoToggle" class="pill" data-i18n="nav.auto" data-i18n-title="nav.autoTip"></button>
        <button id="seeToggle" class="pill" data-i18n="nav.see" data-i18n-title="nav.seeTip"></button>
        <button id="explodeToggle" class="pill" hidden data-i18n="nav.explode" data-i18n-title="nav.explodeTip"></button>
        <button id="stackToggle" class="pill" hidden data-i18n="nav.stack" data-i18n-title="nav.stackTip"></button>
        <button id="halfToggle" class="pill" data-i18n="nav.half" data-i18n-title="nav.halfTip"></button>
        <button id="belowLabelsToggle" class="pill" data-i18n="nav.belowLabels" data-i18n-title="nav.belowLabelsTip"></button>
        <button id="wallToggle" class="pill"></button>
        <button id="planFloorsToggle" class="pill" data-i18n-title="nav.planFloorsTip"></button>
        <button id="flowToggle" class="pill" data-i18n="nav.flow" data-i18n-title="nav.flowTip"></button>
        <button id="tilesToggle" class="pill" data-i18n="nav.tiles" data-i18n-title="nav.tilesTip"></button>
        <button id="roomLabelsToggle" class="pill" data-i18n-title="nav.roomLabelsTip"></button>
      </div>
      <button id="navLeft" class="navArrow" type="button" hidden aria-label="‹">‹</button>
      <button id="navRight" class="navArrow" type="button" hidden aria-label="›">›</button>
      <div id="modeBar"><button class="pill active" data-vm="normal" data-i18n="vm.normal"></button><button class="pill" data-vm="temp" data-i18n="vm.temp"></button><button class="pill" data-vm="humid" data-i18n="vm.humid"></button><button class="pill" data-vm="co2" data-i18n="vm.co2"></button><button id="powerBtn" class="pill" type="button" hidden data-i18n="vm.power" data-i18n-title="vm.powerTip"></button><button id="viewMenuBtn" class="pill" type="button" aria-haspopup="true" aria-expanded="false" data-i18n="nav.view" data-i18n-title="nav.viewTip"></button></div>
      <div id="planFloorsChip">
        <button id="planFloorsBtn" class="pill" type="button" data-i18n-title="nav.planFloorsTip"></button>
        <button id="planRotateBtn" class="pill" type="button" data-i18n="plan.rotate" data-i18n-title="plan.rotateTip"></button>
        <ul id="planFloorsList"></ul>
      </div>
      <div id="viewLegend" hidden></div>
      <button id="guardBar" type="button" hidden data-i18n-title="gd.barTip"></button>
      <div id="alertBar" hidden></div>
      <div id="compass" aria-hidden="true"><svg viewBox="-32 -32 64 64"><g id="compassRose"><circle r="29" class="cRing"/><text y="-19" class="cL cLn">N</text><text x="21" y="3" class="cL">O</text><text y="25" class="cL">S</text><text x="-21" y="3" class="cL">W</text></g><g id="compassNeedle"><path d="M0 -15 L4.5 0 L-4.5 0 Z" class="cN"/><path d="M0 12 L4.5 0 L-4.5 0 Z" class="cS"/><circle r="1.8" class="cHub"/></g></svg><span id="compassFrom"></span></div>
      <div id="skyLine" hidden></div>
      <button id="findBtn" type="button" class="pill" data-i18n-title="find.title" aria-label="Search">🔍</button>
      <button id="voiceBtn" type="button" class="pill" hidden data-i18n-title="vq.mic" aria-label="Voice search">🎤</button>
      <div id="findBox" hidden>
        <div class="findRow"><input id="findInput" type="search" autocomplete="off" data-i18n-placeholder="find.placeholder"><button id="findMic" type="button" class="pill" hidden data-i18n-title="vq.mic" aria-label="Voice search">🎤</button></div>
        <p id="findAnswer" role="status" hidden></p>
        <ul id="findList"></ul>
        <p id="findNone" class="sub" data-i18n="find.none" hidden></p>
      </div>
      <div id="floorRail"></div>
      <div id="floorCards"></div>
      <div id="roomLabels" hidden></div>
      <div id="livePopup" hidden></div>
      <div id="undoToast" hidden role="status"><span></span><button type="button"></button></div>
      <aside id="roomPanel" hidden></aside>
      <div id="sideStack"><div id="skyChips" hidden></div><button id="energyCard" class="glass" type="button" hidden></button></div>
      <div id="roomTiles" hidden></div>
      <button id="tilesLeft" class="tileArrow" type="button" hidden aria-label="‹">‹</button>
      <button id="tilesRight" class="tileArrow" type="button" hidden aria-label="›">›</button>
      <aside id="heatPanel" hidden></aside>
      <aside id="devicePanel" hidden></aside>
    </div>

    <div id="panelResizer" role="separator" aria-orientation="vertical" data-i18n-title="panel.resize"></div>
    <aside id="panel">
      <section id="hint">
        <h3 data-i18n="panel.hint"></h3>
        <p id="hintText"></p>
      </section>

      <details id="housePanel" class="edit-only">
        <summary data-i18n="house.panel"></summary>
        <div id="houseBody"></div>
        <h4 data-i18n="nb.title"></h4>
        <div id="neighborBody"></div>
        <h4 data-i18n="imp.section"></h4>
        <p class="sub" data-i18n="imp.sectionHint"></p>
        <div class="stopTools">
          <button type="button" id="importOpen" data-i18n="imp.open"></button>
          <button type="button" id="propExport" data-i18n="imp.exportProp"></button>
        </div>
      </details>

      <details id="buildingPanel" class="edit-only">
        <summary data-i18n="bld.panel"></summary>
        <div id="buildingBody"></div>
      </details>

      <details id="floorPanel" class="edit-only">
        <summary data-i18n="floor.panel"></summary>
        <div id="floorBody"></div>
      </details>

      <details id="bgPanel" class="edit-only">
        <summary data-i18n="bg.title"></summary>
        <div id="bgBody"></div>
      </details>

      <section id="devicePalette" hidden>
        <h3 data-i18n="panel.deviceType"></h3>
        <input id="paletteSearch" type="search" data-i18n-placeholder="pal.search">
        <div id="paletteCats"></div>
        <div id="paletteRecent" hidden></div>
        <div id="paletteGrid" class="palette thumbs"></div>
        <h3 data-i18n="panel.models"></h3>
        <div id="modelGrid" class="palette"></div>
        <label class="uploadBtn"><span data-i18n="panel.upload"></span>
          <input id="modelFile" type="file" accept=".glb,model/gltf-binary" hidden>
        </label>
        <h3 data-i18n="panel.entity"></h3>
        <input id="entitySearch" type="search" data-i18n-placeholder="panel.entitySearch">
        <select id="entitySelect" size="6"></select>
      </section>



      <section id="measurePanel" hidden>
        <h3 data-i18n="ms.title"></h3>
        <p class="sub" data-i18n="ms.help"></p>
        <div id="measureBody"></div>
      </section>

      <section id="plotPalette" hidden>
        <h3 data-i18n="plot.title"></h3>
        <p class="sub" data-i18n="plot.help"></p>
        <div class="stopTools"><button type="button" id="plotClear" data-i18n="plot.clear"></button></div>
      </section>

      <section id="blockPalette" hidden>
        <h3 data-i18n="block.title"></h3>
        <div class="prop"><label for="blockFloor" data-i18n="block.belongsTo"></label>
          <select id="blockFloor"><option value="below" data-i18n="block.below"></option><option value="this" data-i18n="block.this"></option></select></div>
        <p class="sub" data-i18n="block.help"></p>
      </section>

      <section id="stairPalette" hidden>
        <h3 data-i18n="stair.title"></h3>
        <div class="palette" id="stairTypes">
          <button data-stair="straight" class="active" data-i18n="stair.straight"></button>
          <button data-stair="L" data-i18n="stair.L"></button>
          <button data-stair="U" data-i18n="stair.U"></button>
          <button data-stair="spiral" data-i18n="stair.spiral"></button>
          <button data-stair="wall" data-i18n="stair.wall"></button>
          <button data-stair="shaft" data-i18n="stair.shaft"></button>
        </div>
        <div class="prop"><label for="stairDir" data-i18n="stair.dir"></label>
          <select id="stairDir"><option value="up" data-i18n="stair.up"></option><option value="down" data-i18n="stair.down"></option></select></div>
        <div class="prop"><label for="stairTurn" data-i18n="stair.turn"></label>
          <select id="stairTurn"><option value="right" data-i18n="stair.right"></option><option value="left" data-i18n="stair.left"></option></select></div>
        <div class="prop"><label for="stairFloors" data-i18n="stair.floors"></label><input id="stairFloors" type="number" step="1" min="1" max="6" value="1"></div>
        <div class="prop" hidden><label for="stairLanding" data-i18n="stair.landing"></label><input id="stairLanding" type="number" step="0.1" min="0" max="3" value="0"></div>
        <div class="prop"><label for="stairRot" data-i18n="prop.rotation"></label><input id="stairRot" type="number" step="15" value="0"></div>
        <p class="sub" data-i18n="stair.help2"></p>
      </section>

      <section id="openingPalette" hidden>
        <h3 data-i18n="panel.openingType"></h3>
        <h4 class="opGroup" data-i18n="op.groupDoors"></h4>
        <div class="palette">
          <button data-opening="door" class="active" data-i18n="op.door"></button>
          <button data-opening="doorEntry" data-i18n="op.doorEntry"></button>
          <button data-opening="doorGlass" data-i18n="op.doorGlass"></button>
          <button data-opening="doorDouble" data-i18n="op.doorDouble"></button>
          <button data-opening="doorSlide" data-i18n="op.doorSlide"></button>
        </div>
        <h4 class="opGroup" data-i18n="op.groupPassages"></h4>
        <div class="palette">
          <button data-opening="doorGap" data-i18n="op.doorGap"></button>
          <button data-opening="doorOpen" data-i18n="op.doorOpen"></button>
          <button data-opening="doorGarage" data-i18n="op.doorGarage"></button>
        </div>
        <h4 class="opGroup" data-i18n="op.groupWindows"></h4>
        <div class="palette">
          <button data-opening="window" data-i18n="op.window"></button>
          <button data-opening="window2" data-i18n="op.window2"></button>
          <button data-opening="window3" data-i18n="op.window3"></button>
          <button data-opening="windowTall" data-i18n="op.windowTall"></button>
          <button data-opening="windowBath" data-i18n="op.windowBath"></button>
          <button data-opening="windowFixed" data-i18n="op.windowFixed"></button>
        </div>
      </section>

      <section id="objList" hidden>
        <h3 data-i18n="panel.objects"></h3>
        <div id="objListBody"></div>
      </section>

      <section id="props" hidden>
        <h3 id="propsTitle"></h3>
        <div id="propsBody"></div>
      </section>

      <section id="controlsHelp">
        <h3 data-i18n="panel.controls"></h3>
        <ul class="keys">
          <li data-i18n="keys.rotate"></li>
          <li data-i18n="keys.pan"></li>
          <li data-i18n="keys.zoom"></li>
          <li data-i18n="keys.qe"></li>
          <li data-i18n="keys.del"></li>
          <li data-i18n="keys.multi"></li>
          <li data-i18n="keys.measure"></li>
          <li data-i18n="keys.esc"></li>
          <li data-i18n="keys.undo"></li>
          <li data-i18n="keys.redo"></li>
          <li data-i18n="keys.copy"></li>
        </ul>
        <button id="keysBtn" type="button" class="keysBtn" data-i18n="kc.btn"></button>
      </section>
    </aside>
  </main>
  <div id="tabEditBar" hidden></div>
  <nav id="tabBar" hidden></nav>
</div>

<dialog id="importDialog">
  <form method="dialog" novalidate>
    <div class="dlgHead"><h2 data-i18n="imp.title"></h2><button type="submit" class="dlgClose" formnovalidate aria-label="Close" data-i18n-title="close">✕</button></div>
    <p class="sub" data-i18n="imp.hint"></p>
    <div class="impBar">
      <label class="btn"><span data-i18n="imp.file"></span><input type="file" id="importFile" accept=".json,.geojson,application/json" hidden></label>
      <button type="button" id="importExFlat" data-i18n="imp.exFlat"></button>
      <button type="button" id="importExHouse" data-i18n="imp.exHouse"></button>
      <button type="button" id="importExShow" data-i18n="imp.exShow"></button>
      <button type="button" id="importPrompt" data-i18n="imp.prompt"></button>
    </div>
    <textarea id="importText" spellcheck="false" data-i18n-placeholder="imp.placeholder"></textarea>
    <input type="text" id="importName" data-i18n-placeholder="imp.name">
    <div id="importResult"></div>
    <div class="impFoot">
      <button type="button" id="importCheck" data-i18n="imp.check"></button>
      <button type="button" id="importRun" class="primary" disabled data-i18n="imp.run"></button>
    </div>
  </form>
</dialog>

<dialog id="conflictDialog">
  <form method="dialog" novalidate>
    <div class="dlgHead"><h2 data-i18n="conf.title"></h2></div>
    <p data-i18n="conf.text"></p>
    <div class="stopTools">
      <button type="submit" value="reload" id="conflictReload" class="primary" data-i18n="conf.reload"></button>
      <button type="submit" value="keep" id="conflictKeep" data-i18n="conf.keep"></button>
    </div>
  </form>
</dialog>

<dialog id="keysDialog">
  <form method="dialog" novalidate>
    <div class="dlgHead"><h2 data-i18n="kc.title"></h2><button type="submit" class="dlgClose" formnovalidate aria-label="Close" data-i18n-title="close">✕</button></div>
    <p class="sub" data-i18n="kc.hint"></p>
    <div id="keysList"></div>
  </form>
</dialog>

<dialog id="offlineDialog">
  <form method="dialog" novalidate>
    <div class="dlgHead"><h2 data-i18n="off.title"></h2><button type="submit" class="dlgClose" formnovalidate aria-label="Close" data-i18n-title="close">✕</button></div>
    <p class="sub" data-i18n="off.hint"></p>
    <p id="offlineNone" data-i18n="off.none" hidden></p>
    <ul id="offlineList"></ul>
  </form>
</dialog>

<dialog id="openDialog">
  <form method="dialog" novalidate>
    <div class="dlgHead"><h2 data-i18n="open.title"></h2><button type="submit" class="dlgClose" formnovalidate aria-label="Close" data-i18n-title="close">✕</button></div>
    <p class="sub" data-i18n="open.hint"></p>
    <p id="openNone" data-i18n="open.allClosed" hidden></p>
    <ul id="openList"></ul>
  </form>
</dialog>

<dialog id="versionDialog">
  <form method="dialog" novalidate>
    <div class="dlgHead"><h2 data-i18n="ver.title"></h2><button type="submit" class="dlgClose" formnovalidate aria-label="Close" data-i18n-title="close">✕</button></div>
    <div id="versionBody"></div>
    <div class="stopTools">
      <button type="button" id="versionCheck" data-i18n="ver.check"></button>
      <button type="button" id="versionReload" data-i18n="ver.reload" hidden></button>
    </div>
  </form>
</dialog>

<dialog id="toolsDialog">
  <form method="dialog" novalidate>
    <div class="dlgHead"><h2 data-i18n="tbar.title"></h2><button type="submit" class="dlgClose" formnovalidate aria-label="Close" data-i18n-title="close">✕</button></div>
    <p class="hint" data-i18n="tbar.hint"></p>
    <div class="tbHead"><span data-i18n="tbar.show"></span><span data-i18n="tbar.tool"></span><span data-i18n="tbar.fold"></span></div>
    <div id="toolsList"></div>
    <div class="stopTools"><button type="button" id="toolsReset" data-i18n="tbar.reset"></button></div>

    <menu><button value="close" class="primary" data-i18n="close"></button></menu>
  </form>
</dialog>

<div id="guardScreen" hidden role="dialog" aria-modal="true"></div>

</body>
