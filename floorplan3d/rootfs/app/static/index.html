<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
  <link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Floorplan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nightDim" hidden></div>
<div id="app">
  <header id="toolbar">
    <div class="group" id="modeSwitch">
      <button data-mode="edit" class="active" data-i18n="mode.edit"></button>
      <button data-mode="live" data-i18n="mode.live" data-i18n-title="mode.liveTip"></button>
    </div>
    <div class="group edit-only" id="tools">
      <button data-tool="select" class="active" data-i18n="tool.select" data-i18n-title="tip.select"></button>
      <button data-tool="wall" data-i18n="tool.wall" data-i18n-title="tip.wall"></button>
      <button data-tool="room" data-i18n="tool.room" data-i18n-title="tip.room"></button>
      <button id="autoRooms" data-i18n="tool.autoRooms" data-i18n-title="tip.autoRooms"></button>
      <button data-tool="block" data-i18n="tool.block" data-i18n-title="tip.block"></button>
      <button data-tool="plot" data-i18n="tool.plot" data-i18n-title="tip.plot"></button>
      <button data-tool="stairs" data-i18n="tool.stairs" data-i18n-title="tip.stairs"></button>
      <button data-tool="hole" data-i18n="tool.hole" data-i18n-title="tip.hole"></button>
      <button data-tool="opening" data-i18n="tool.opening" data-i18n-title="tip.opening"></button>
      <button data-tool="device" data-i18n="tool.device" data-i18n-title="tip.device"></button>
      <button data-tool="erase" data-i18n="tool.erase" data-i18n-title="tip.erase"></button>
      <button id="dormerBtn" type="button" data-i18n="tool.dormer" data-i18n-title="tip.dormer"></button>
      <button id="importBtn" type="button" data-i18n="tool.import" data-i18n-title="tip.import"></button>
      <button id="toolsMoreBtn" type="button" hidden aria-haspopup="true" aria-expanded="false" data-i18n="tool.more" data-i18n-title="tip.more"></button>
      <div id="toolsMore" hidden></div>
      <button id="toolsEditBtn" type="button" class="icon" data-i18n-title="tbar.edit" aria-label="Customise tools">✎</button>
    </div>
    <div class="group">
      <button id="view2d" data-i18n="view.2d"></button>
      <button id="view3d" class="active" data-i18n="view.3d"></button>
      <button id="viewSplit" data-i18n="view.split"></button>
      <button id="fitBtn" data-i18n="view.fit"></button>
    </div>
    <div class="group">
      <button id="addFloor" class="edit-only" data-i18n="floor.add"></button>
    </div>
    <div class="group" id="houseGroup" hidden>
      <select id="houseSelect" aria-label="House"></select>
    </div>
    <div class="group right">
      <span id="status"></span>
      <button id="versionPill" class="pill ver-wait" type="button" hidden></button>
      <button id="usersBtn" class="admin-only" data-i18n="users.btn" data-i18n-title="users.tip"></button>
      <button id="saveBtn" class="primary edit-only" data-i18n="save"></button>
      <button id="settingsBtn" class="icon" data-i18n-title="settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main>
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="welcome" hidden>
        <button id="welClose" type="button" class="dlgClose" aria-label="Close" data-i18n-title="close">✕</button>
        <h2 data-i18n="wel.title"></h2>
        <p data-i18n="wel.text"></p>
        <div class="welBtns">
          <button id="welDraw" type="button" class="primary" data-i18n="wel.draw"></button>
          <button id="welExample" type="button" data-i18n="wel.example"></button>
          <button id="welImport" type="button" data-i18n="wel.import"></button>
        </div>
      </div>
      <nav id="navBar">
        <div id="floorPills" class="pills"></div>
        <span class="sep" id="navSep"></span>
        <div id="roomPills" class="pills"><button id="roomMenuBtn" class="pill" type="button" hidden aria-haspopup="true" aria-expanded="false" data-i18n-title="nav.roomsTip"></button></div>
        <span class="spacer"></span>
        <button id="houseToggle" class="pill" hidden></button>
        <button id="offlinePill" class="pill" hidden data-i18n-title="off.tip"></button>
        <button id="openPill" class="pill" hidden></button>
        <button id="camPill" class="pill" hidden data-i18n-title="cam.pillTip"></button>
      </nav>
      <div id="roomMenu" hidden></div>
      <div id="camMenu" hidden>
        <p class="sub" data-i18n="cam.hint"></p>
        <div id="camGrid"></div>
      </div>
      <div id="viewMenu" hidden>
        <button id="autoToggle" class="pill" data-i18n="nav.auto" data-i18n-title="nav.autoTip"></button>
        <button id="seeToggle" class="pill" data-i18n="nav.see" data-i18n-title="nav.seeTip"></button>
        <button id="explodeToggle" class="pill" hidden data-i18n="nav.explode" data-i18n-title="nav.explodeTip"></button>
        <button id="halfToggle" class="pill" data-i18n="nav.half" data-i18n-title="nav.halfTip"></button>
        <button id="wallToggle" class="pill"></button>
        <button id="planFloorsToggle" class="pill" data-i18n-title="nav.planFloorsTip"></button>
      </div>
      <button id="navLeft" class="navArrow" type="button" hidden aria-label="‹">‹</button>
      <button id="navRight" class="navArrow" type="button" hidden aria-label="›">›</button>
      <div id="modeBar"><button class="pill active" data-vm="normal" data-i18n="vm.normal"></button><button class="pill" data-vm="temp" data-i18n="vm.temp"></button><button class="pill" data-vm="humid" data-i18n="vm.humid"></button><button class="pill" data-vm="co2" data-i18n="vm.co2"></button><button id="viewMenuBtn" class="pill" type="button" aria-haspopup="true" aria-expanded="false" data-i18n="nav.view" data-i18n-title="nav.viewTip"></button></div>
      <div id="planFloorsChip">
        <button id="planFloorsBtn" class="pill" type="button" data-i18n-title="nav.planFloorsTip"></button>
        <ul id="planFloorsList"></ul>
      </div>
      <div id="viewLegend" hidden></div>
      <div id="alertBar" hidden></div>
      <div id="compass" aria-hidden="true"><svg viewBox="-32 -32 64 64"><g id="compassRose"><circle r="29" class="cRing"/><path d="M0 -26 L5 0 L-5 0 Z" class="cN"/><path d="M0 26 L5 0 L-5 0 Z" class="cS"/><text y="-17" class="cL cLn">N</text><text x="19" y="3" class="cL">O</text><text y="23" class="cL">S</text><text x="-19" y="3" class="cL">W</text></g></svg><span id="compassFrom"></span></div>
      <button id="findBtn" type="button" class="pill" data-i18n-title="find.title" aria-label="Search">🔍</button>
      <div id="findBox" hidden>
        <input id="findInput" type="search" autocomplete="off" data-i18n-placeholder="find.placeholder">
        <ul id="findList"></ul>
        <p id="findNone" class="sub" data-i18n="find.none" hidden></p>
      </div>
      <div id="floorRail"></div>
      <div id="floorCards"></div>
      <div id="livePopup" hidden></div>
      <aside id="roomPanel" hidden></aside>
    </div>

    <div id="panelResizer" role="separator" aria-orientation="vertical" data-i18n-title="panel.resize"></div>
    <aside id="panel">
      <section id="hint">
        <h3 data-i18n="panel.hint"></h3>
        <p id="hintText"></p>
      </section>

      <details id="housePanel" class="edit-only">
        <summary data-i18n="house.panel"></summary>
        <div id="houseBody"></div>
        <h4 data-i18n="backup.title"></h4>
        <p class="sub" data-i18n="backup.hint"></p>
        <div class="stopTools">
          <a id="backupExport" class="btn" href="api/backup" download data-i18n="backup.export"></a>
          <button type="button" id="backupImport" data-i18n="backup.import"></button>
          <input type="file" id="backupFile" accept=".json,application/json" hidden>
        </div>
        <div id="autoBackup" hidden>
          <h4 data-i18n="ab.title"></h4>
          <p class="sub" data-i18n="ab.hint"></p>
          <div class="row check"><input id="setAutoBackup" type="checkbox"><label for="setAutoBackup" data-i18n="ab.enable"></label></div>
          <div class="prop stack"><label for="setBackupEvery" data-i18n="ab.every"></label><input id="setBackupEvery" type="number" min="1" max="720" step="1"></div>
          <div class="prop stack"><label for="setBackupKeepDays" data-i18n="ab.keepDays"></label><input id="setBackupKeepDays" type="number" min="1" max="3650" step="1"></div>
          <div class="prop stack"><label for="setBackupKeepCount" data-i18n="ab.keepCount"></label><input id="setBackupKeepCount" type="number" min="1" max="500" step="1"></div>
          <div class="stopTools">
            <button type="button" id="abNow" data-i18n="ab.now"></button>
            <button type="button" id="abTest" data-i18n="ab.test"></button>
          </div>
          <p class="sub" id="abStatus"></p>
          <div id="abList"></div>
        </div>
        <h4 data-i18n="imp.section"></h4>
        <p class="sub" data-i18n="imp.sectionHint"></p>
        <div class="stopTools">
          <button type="button" id="importOpen" data-i18n="imp.open"></button>
          <button type="button" id="propExport" data-i18n="imp.exportProp"></button>
        </div>
      </details>

      <details id="floorPanel" class="edit-only">
        <summary data-i18n="floor.panel"></summary>
        <div id="floorBody"></div>
      </details>

      <details id="bgPanel" class="edit-only">
        <summary data-i18n="bg.title"></summary>
        <div id="bgBody"></div>
      </details>

      <section id="devicePalette" hidden>
        <h3 data-i18n="panel.deviceType"></h3>
        <input id="paletteSearch" type="search" data-i18n-placeholder="pal.search">
        <div id="paletteCats"></div>
        <div id="paletteGrid" class="palette thumbs"></div>
        <h3 data-i18n="panel.models"></h3>
        <div id="modelGrid" class="palette"></div>
        <label class="uploadBtn"><span data-i18n="panel.upload"></span>
          <input id="modelFile" type="file" accept=".glb,model/gltf-binary" hidden>
        </label>
        <h3 data-i18n="panel.entity"></h3>
        <input id="entitySearch" type="search" data-i18n-placeholder="panel.entitySearch">
        <select id="entitySelect" size="6"></select>
      </section>



      <section id="plotPalette" hidden>
        <h3 data-i18n="plot.title"></h3>
        <p class="sub" data-i18n="plot.help"></p>
        <div class="stopTools"><button type="button" id="plotClear" data-i18n="plot.clear"></button></div>
      </section>

      <section id="blockPalette" hidden>
        <h3 data-i18n="block.title"></h3>
        <div class="prop"><label for="blockFloor" data-i18n="block.belongsTo"></label>
          <select id="blockFloor"><option value="below" data-i18n="block.below"></option><option value="this" data-i18n="block.this"></option></select></div>
        <p class="sub" data-i18n="block.help"></p>
      </section>

      <section id="stairPalette" hidden>
        <h3 data-i18n="stair.title"></h3>
        <div class="palette" id="stairTypes">
          <button data-stair="straight" class="active" data-i18n="stair.straight"></button>
          <button data-stair="L" data-i18n="stair.L"></button>
          <button data-stair="U" data-i18n="stair.U"></button>
          <button data-stair="spiral" data-i18n="stair.spiral"></button>
          <button data-stair="shaft" data-i18n="stair.shaft"></button>
        </div>
        <div class="prop"><label for="stairDir" data-i18n="stair.dir"></label>
          <select id="stairDir"><option value="up" data-i18n="stair.up"></option><option value="down" data-i18n="stair.down"></option></select></div>
        <div class="prop"><label for="stairTurn" data-i18n="stair.turn"></label>
          <select id="stairTurn"><option value="right" data-i18n="stair.right"></option><option value="left" data-i18n="stair.left"></option></select></div>
        <div class="prop"><label for="stairRot" data-i18n="prop.rotation"></label><input id="stairRot" type="number" step="15" value="0"></div>
        <p class="sub" data-i18n="stair.help2"></p>
      </section>

      <section id="openingPalette" hidden>
        <h3 data-i18n="panel.openingType"></h3>
        <h4 class="opGroup" data-i18n="op.groupDoors"></h4>
        <div class="palette">
          <button data-opening="door" class="active" data-i18n="op.door"></button>
          <button data-opening="doorEntry" data-i18n="op.doorEntry"></button>
          <button data-opening="doorGlass" data-i18n="op.doorGlass"></button>
          <button data-opening="doorDouble" data-i18n="op.doorDouble"></button>
          <button data-opening="doorSlide" data-i18n="op.doorSlide"></button>
        </div>
        <h4 class="opGroup" data-i18n="op.groupPassages"></h4>
        <div class="palette">
          <button data-opening="doorGap" data-i18n="op.doorGap"></button>
          <button data-opening="doorOpen" data-i18n="op.doorOpen"></button>
          <button data-opening="doorGarage" data-i18n="op.doorGarage"></button>
        </div>
        <h4 class="opGroup" data-i18n="op.groupWindows"></h4>
        <div class="palette">
          <button data-opening="window" data-i18n="op.window"></button>
          <button data-opening="window2" data-i18n="op.window2"></button>
          <button data-opening="window3" data-i18n="op.window3"></button>
          <button data-opening="windowTall" data-i18n="op.windowTall"></button>
          <button data-opening="windowBath" data-i18n="op.windowBath"></button>
          <button data-opening="windowFixed" data-i18n="op.windowFixed"></button>
        </div>
      </section>

      <section id="objList" hidden>
        <h3 data-i18n="panel.objects"></h3>
        <div id="objListBody"></div>
      </section>

      <section id="props" hidden>
        <h3 id="propsTitle"></h3>
        <div id="propsBody"></div>
      </section>

      <section id="controlsHelp">
        <h3 data-i18n="panel.controls"></h3>
        <ul class="keys">
          <li data-i18n="keys.rotate"></li>
          <li data-i18n="keys.pan"></li>
          <li data-i18n="keys.zoom"></li>
          <li data-i18n="keys.qe"></li>
          <li data-i18n="keys.del"></li>
          <li data-i18n="keys.esc"></li>
          <li data-i18n="keys.undo"></li>
        </ul>
      </section>
    </aside>
  </main>
</div>

<dialog id="importDialog">
  <form method="dialog" novalidate>
    <div class="dlgHead"><h2 data-i18n="imp.title"></h2><button type="submit" class="dlgClose" formnovalidate aria-label="Close" data-i18n-title="close">✕</button></div>
    <p class="sub" data-i18n="imp.hint"></p>
    <div class="impBar">
      <label class="btn"><span data-i18n="imp.file"></span><input type="file" id="importFile" accept=".json,.geojson,application/json" hidden></label>
      <button type="button" id="importExFlat" data-i18n="imp.exFlat"></button>
      <button type="button" id="importExHouse" data-i18n="imp.exHouse"></button>
      <button type="button" id="importPrompt" data-i18n="imp.prompt"></button>
    </div>
    <textarea id="importText" spellcheck="false" data-i18n-placeholder="imp.placeholder"></textarea>
    <input type="text" id="importName" data-i18n-placeholder="imp.name">
    <div id="importResult"></div>
    <div class="impFoot">
      <button type="button" id="importCheck" data-i18n="imp.check"></button>
      <button type="button" id="importRun" class="primary" disabled data-i18n="imp.run"></button>
    </div>
  </form>
</dialog>

<dialog id="offlineDialog">
  <form method="dialog" novalidate>
    <div class="dlgHead"><h2 data-i18n="off.title"></h2><button type="submit" class="dlgClose" formnovalidate aria-label="Close" data-i18n-title="close">✕</button></div>
    <p class="sub" data-i18n="off.hint"></p>
    <p id="offlineNone" data-i18n="off.none" hidden></p>
    <ul id="offlineList"></ul>
  </form>
</dialog>

<dialog id="openDialog">
  <form method="dialog" novalidate>
    <div class="dlgHead"><h2 data-i18n="open.title"></h2><button type="submit" class="dlgClose" formnovalidate aria-label="Close" data-i18n-title="close">✕</button></div>
    <p class="sub" data-i18n="open.hint"></p>
    <p id="openNone" data-i18n="open.allClosed" hidden></p>
    <ul id="openList"></ul>
  </form>
</dialog>

<dialog id="versionDialog">
  <form method="dialog" novalidate>
    <div class="dlgHead"><h2 data-i18n="ver.title"></h2><button type="submit" class="dlgClose" formnovalidate aria-label="Close" data-i18n-title="close">✕</button></div>
    <div id="versionBody"></div>
    <div class="stopTools">
      <button type="button" id="versionCheck" data-i18n="ver.check"></button>
      <button type="button" id="versionReload" data-i18n="ver.reload" hidden></button>
    </div>
  </form>
</dialog>

<dialog id="toolsDialog">
  <form method="dialog" novalidate>
    <div class="dlgHead"><h2 data-i18n="tbar.title"></h2><button type="submit" class="dlgClose" formnovalidate aria-label="Close" data-i18n-title="close">✕</button></div>
    <p class="hint" data-i18n="tbar.hint"></p>
    <div class="tbHead"><span data-i18n="tbar.show"></span><span data-i18n="tbar.tool"></span><span data-i18n="tbar.fold"></span></div>
    <div id="toolsList"></div>
    <div class="stopTools"><button type="button" id="toolsReset" data-i18n="tbar.reset"></button></div>
  </form>
</dialog>

<dialog id="usersDialog">
  <form method="dialog" novalidate>
    <div class="dlgHead"><h2 data-i18n="set.section.tablets"></h2><button type="submit" class="dlgClose" formnovalidate aria-label="Close" data-i18n-title="close">✕</button></div>
    <p class="hint" data-i18n="set.tabletHelp"></p>
    <datalist id="haUsers"></datalist>
    <div id="tabletRows"></div>
    <div class="stopTools"><button type="button" id="addTablet" data-i18n="set.addTablet"></button></div>

    <h3 data-i18n="users.fileTitle"></h3>
    <p class="hint" data-i18n="users.fileHelp"></p>
    <div class="stopTools"><button type="button" id="usersSave" data-i18n="users.saveBtn" data-i18n-title="users.saveTip"></button> <button type="button" id="usersSync" data-i18n="users.syncBtn" data-i18n-title="users.syncTip"></button></div>
    <p class="sub" id="usersFileStatus"></p>
  </form>
</dialog>

<dialog id="settingsDialog">
  <form method="dialog" novalidate>
    <div class="dlgHead"><h2 data-i18n="settings"></h2><button type="submit" class="dlgClose" formnovalidate aria-label="Close" data-i18n-title="close">✕</button></div>

    <h3 data-i18n="set.section.general"></h3>
    <div class="row"><label for="setLanguage" data-i18n="set.language"></label>
      <select id="setLanguage"><option value="auto">Auto</option><option value="de">Deutsch</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="it">Italiano</option><option value="nl">Nederlands</option><option value="pl">Polski</option></select></div>
    <div class="row"><label for="setTheme" data-i18n="set.theme"></label>
      <select id="setTheme"><option value="holo" data-i18n="set.theme.holo"></option><option value="dark" data-i18n="set.theme.dark"></option><option value="light" data-i18n="set.theme.light"></option></select></div>
    <div class="row"><label for="setUnits" data-i18n="set.units"></label>
      <select id="setUnits"><option value="metric" data-i18n="set.units.metric"></option><option value="imperial" data-i18n="set.units.imperial"></option></select></div>

    <h3 data-i18n="set.section.drawing"></h3>
    <div class="row"><label for="setGrid" data-i18n="set.grid"></label>
      <select id="setGrid"><option value="0.05">5 cm</option><option value="0.1">10 cm</option><option value="0.25">25 cm</option><option value="0.5">50 cm</option><option value="1">1 m</option></select></div>
    <div class="row"><label for="setWallHeight" data-i18n="set.wallHeight"></label>
      <input id="setWallHeight" type="number" step="any"></div>
    <div class="row"><label for="setWallThickness" data-i18n="set.wallThickness"></label>
      <input id="setWallThickness" type="number" step="any"></div>
    <div class="row"><label for="setAutosave" data-i18n="set.autosave"></label>
      <input id="setAutosave" type="number" step="any"></div>

    <h3 data-i18n="set.section.view"></h3>
    <div class="row check"><input id="setShadows" type="checkbox"><label for="setShadows" data-i18n="set.shadows"></label></div>
    <div class="row"><label for="setPerf" data-i18n="set.perf"></label>
      <select id="setPerf"><option value="auto" data-i18n="set.perf.auto"></option><option value="high" data-i18n="set.perf.high"></option><option value="low" data-i18n="set.perf.low"></option></select></div>
    <p class="sub" data-i18n="set.perfHint"></p>
    <div class="row"><label for="setLabels" data-i18n="set.labels"></label>
      <select id="setLabels"><option value="important" data-i18n="set.labels.important"></option><option value="all" data-i18n="set.labels.all"></option><option value="none" data-i18n="set.labels.none"></option></select></div>
    <div class="row check"><input id="setCameraImages" type="checkbox"><label for="setCameraImages" data-i18n="set.cameraImages" data-i18n-title="set.cameraImagesHint"></label></div>
    <div class="row check"><input id="setWallStop" type="checkbox"><label for="setWallStop" data-i18n="set.wallStop"></label></div>
    <div class="row check"><input id="setPlaceSelect" type="checkbox"><label for="setPlaceSelect" data-i18n="set.placeSelect"></label></div>
    <div class="row check"><input id="setUpdateCheck" type="checkbox"><label for="setUpdateCheck" data-i18n="set.updateCheck"></label></div>
    <div class="row check"><input id="setCutaway" type="checkbox"><label for="setCutaway" data-i18n="set.cutaway"></label></div>
    <div class="row check"><input id="setSeeThrough" type="checkbox"><label for="setSeeThrough" data-i18n="set.seeThrough"></label></div>
    <div class="row"><label for="setEarth" data-i18n="set.earth"></label>
      <select id="setEarth"><option value="solid" data-i18n="set.earth.solid"></option><option value="glass" data-i18n="set.earth.glass"></option><option value="off" data-i18n="set.earth.off"></option></select></div>
    <div class="row"><label for="setEarthMargin" data-i18n="set.earthMargin"></label><input id="setEarthMargin" type="number" step="any"></div>
    <p id="earthMarginNote" class="sub" data-i18n="set.earthMarginPlot" hidden></p>
    <div class="row check"><input id="setLowWalls" type="checkbox"><label for="setLowWalls" data-i18n="set.lowWalls"></label></div>

    <h3 data-i18n="set.section.kiosk"></h3>
    <p class="hint" data-i18n="set.kioskHelp"></p>
    <div class="row check"><input id="setAlerts" type="checkbox"><label for="setAlerts" data-i18n="set.alerts"></label></div>
    <div class="row check"><input id="setAlertJump" type="checkbox"><label for="setAlertJump" data-i18n="set.alertJump"></label></div>
    <div class="row"><label for="setWeather" data-i18n="set.weather"></label><input id="setWeather" type="text" placeholder="weather.home" list="weatherList"></div>
    <datalist id="weatherList"></datalist>
    <div class="row"><label for="setIdleReturn" data-i18n="set.idleReturn"></label><input id="setIdleReturn" type="number" min="0" step="1"></div>
    <div class="row check"><input id="setIdleOrbit" type="checkbox"><label for="setIdleOrbit" data-i18n="set.idleOrbit"></label></div>
    <div class="row"><label for="setNightDim" data-i18n="set.nightDim"></label>
      <select id="setNightDim"><option value="off" data-i18n="set.nightDim.off"></option><option value="sun" data-i18n="set.nightDim.sun"></option><option value="time" data-i18n="set.nightDim.time"></option></select></div>
    <div class="row"><label for="setNightFrom" data-i18n="set.nightFrom"></label><input id="setNightFrom" type="time"></div>
    <div class="row"><label for="setNightTo" data-i18n="set.nightTo"></label><input id="setNightTo" type="time"></div>

    <h3 data-i18n="set.section.look"></h3>
    <div class="row"><label for="setWallOpacity" data-i18n="set.wallOpacity"></label><input id="setWallOpacity" type="number" step="any" min="0.2" max="1"></div>
    <div class="row"><label for="setBelow" data-i18n="set.below"></label><input id="setBelow" type="number" step="any" min="0.05" max="1"></div>
    <div class="row"><label for="setBelowMode" data-i18n="set.belowMode"></label>
      <select id="setBelowMode"><option value="dim" data-i18n="set.belowMode.dim"></option><option value="stacked" data-i18n="set.belowMode.stacked"></option><option value="hidden" data-i18n="set.belowMode.hidden"></option></select></div>
    <div class="row"><label for="setGlowRadius" data-i18n="set.glowRadius"></label><input id="setGlowRadius" type="number" step="any"></div>
    <div class="row"><label for="setGlowStrength" data-i18n="set.glowStrength"></label><input id="setGlowStrength" type="number" step="any"></div>
    <div class="row"><label for="setGlowHeight" data-i18n="set.glowHeight"></label><input id="setGlowHeight" type="number" step="any"></div>
    <div class="row"><label for="setDefaultLight" data-i18n="set.defaultLight"></label><input id="setDefaultLight" type="color"></div>
    <div class="row"><label for="setBgTop" data-i18n="set.bgTop"></label><input id="setBgTop" type="color"></div>
    <div class="row"><label for="setBgBottom" data-i18n="set.bgBottom"></label><input id="setBgBottom" type="color"></div>
    <div class="row"><label for="setBgGlow" data-i18n="set.bgGlow"></label><input id="setBgGlow" type="color"></div>
    <div class="row"><label for="setBgGlowStrength" data-i18n="set.bgGlowStrength"></label><input id="setBgGlowStrength" type="range" min="0" max="1" step="0.05"></div>

    <h3 data-i18n="set.section.tempColors"></h3>
    <div id="tempStops" class="stops"></div>
    <h3 data-i18n="set.section.humidColors"></h3>
    <div id="humidStops" class="stops"></div>
    <h3 data-i18n="set.section.co2Colors"></h3>
    <div id="co2Stops" class="stops"></div>

    <menu><button value="close" class="primary" data-i18n="close"></button></menu>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
