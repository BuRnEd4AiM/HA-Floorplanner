<svg xmlns="http://www.w3.org/2000/svg" width="430" height="92" viewBox="0 0 430 92" role="img" aria-label="Donate with PayPal: a cup of tea prevents brain overflow">
  <!-- The donate button of the README (the owner's wish, 2026-11-03: "so auf niedlich", easy to see next to
       "Add repository"). A little house with a face and a beating heart; links to PayPal in README.md. -->
  <title>Donate with PayPal: a cup of tea prevents brain overflow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2f7"/>
      <stop offset="55%" stop-color="#ffe3ee"/>
      <stop offset="100%" stop-color="#ffecd2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd76b" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffd76b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#c2456b" flood-opacity=".28"/>
    </filter>
  </defs>
  <style>
    .t { font-family: "Nunito", "Quicksand", "Varela Round", ui-rounded, "SF Pro Rounded", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .heart { transform-origin: 73px 21px; animation: beat 1.6s ease-in-out infinite; }
    .spark { transform-origin: 18px 22px; animation: twinkle 2.4s ease-in-out infinite; }
    .spark2 { transform-origin: 382px 22px; animation: twinkle 2.4s ease-in-out 1.2s infinite; }
    .lid { transform-origin: 0 52px; animation: blink 5s infinite; }
    .win { animation: shine 3s ease-in-out infinite; }
    @keyframes beat { 0%, 40%, 100% { transform: scale(1); } 15% { transform: scale(1.22); } 28% { transform: scale(1.08); } }
    @keyframes twinkle { 0%, 100% { transform: scale(.4); opacity: .3; } 50% { transform: scale(1); opacity: 1; } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes shine { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .steam { animation: rise 2.6s ease-in-out infinite; }
    .steam2 { animation-delay: 1.3s; }
    @keyframes rise { 0% { transform: translateY(3px); opacity: 0; } 35% { opacity: .9; } 100% { transform: translateY(-5px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .heart, .spark, .spark2, .lid, .win, .steam { animation: none; } }
  </style>

  <!-- the pill -->
  <rect x="5" y="5" width="420" height="78" rx="39" fill="url(#bg)" stroke="#ff9fbd" stroke-width="2.5" filter="url(#shadow)"/>

  <!-- round frame for the house -->
  <circle cx="46" cy="44" r="31" fill="#ffffff" stroke="#ffc2d4" stroke-width="2"/>
  <circle cx="46" cy="52" r="20" fill="url(#glow)" class="win"/>

  <!-- the little house -->
  <rect x="55" y="25" width="6" height="11" rx="1.5" fill="#a83a5e"/>
  <rect x="29" y="42" width="34" height="26" rx="5" fill="#fff6e8" stroke="#f3cfa9" stroke-width="1.5"/>
  <path d="M24 45 L46 25 L68 45" fill="#e8567f" stroke="#e8567f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- face -->
  <g class="lid">
    <ellipse cx="39.5" cy="52" rx="2.3" ry="2.7" fill="#4a2a3f"/>
    <ellipse cx="52.5" cy="52" rx="2.3" ry="2.7" fill="#4a2a3f"/>
    <circle cx="40.3" cy="51" r=".8" fill="#ffffff"/>
    <circle cx="53.3" cy="51" r=".8" fill="#ffffff"/>
  </g>
  <ellipse cx="34.5" cy="58" rx="3.2" ry="1.9" fill="#ffadc4"/>
  <ellipse cx="57.5" cy="58" rx="3.2" ry="1.9" fill="#ffadc4"/>
  <path d="M42.5 57.5 q3.5 3.6 7 0" fill="none" stroke="#4a2a3f" stroke-width="1.6" stroke-linecap="round"/>

  <!-- the heart above the roof -->
  <path class="heart" d="M73 28 c-7-5.5-10.5-8.6-10.5-12.6 a5.25 5.25 0 0 1 10.5-1.8 a5.25 5.25 0 0 1 10.5 1.8 c0 4-3.5 7.1-10.5 12.6z" fill="#ff4f81" stroke="#ffffff" stroke-width="1.5"/>

  <!-- sparkles -->
  <path class="spark" d="M18 15 l1.6 5.4 5.4 1.6 -5.4 1.6 -1.6 5.4 -1.6 -5.4 -5.4 -1.6 5.4 -1.6z" fill="#ffc94d"/>
  <g transform="translate(30 0)">
  <path class="spark2" d="M382 15 l1.3 4.7 4.7 1.3 -4.7 1.3 -1.3 4.7 -1.3 -4.7 -4.7 -1.3 4.7 -1.3z" fill="#ff9fbd"/>

  <!-- the little cup of tea (the owner drinks tea, not coffee) -->
  <g class="steam"><path d="M347 30 q-3 -4 0 -8 q3 -4 0 -8" fill="none" stroke="#e7a3bb" stroke-width="2" stroke-linecap="round"/></g>
  <g class="steam steam2"><path d="M355 30 q-3 -4 0 -8 q3 -4 0 -8" fill="none" stroke="#e7a3bb" stroke-width="2" stroke-linecap="round"/></g>
  <ellipse cx="351" cy="62" rx="19" ry="4" fill="#ffffff" stroke="#ffc2d4" stroke-width="1.5"/>
  <path d="M365 41 a6 6 0 0 1 0 12" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <path d="M365 41 a6 6 0 0 1 0 12" fill="none" stroke="#ff9fbd" stroke-width="2" stroke-linecap="round"/>
  <path d="M337 36 h28 v6 a14 16 0 0 1 -28 0 z" fill="#ffffff" stroke="#ff9fbd" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="351" cy="36.5" rx="13" ry="2.4" fill="#d98b3a"/>
  <line x1="359" y1="36" x2="362" y2="46" stroke="#c9a27a" stroke-width="1"/>
  <rect x="359.5" y="45" width="6" height="7" rx="1" fill="#ffd76b" transform="rotate(-12 362.5 48.5)"/>
  <path d="M349 50 c-3-2.3-4.5-3.6-4.5-5.4 a2.25 2.25 0 0 1 4.5-.8 a2.25 2.25 0 0 1 4.5 .8 c0 1.8-1.5 3.1-4.5 5.4z" fill="#ff7aa0"/>
  </g>

  <!-- text -->
  <text class="t" x="92" y="42" font-size="21" font-weight="800" fill="#8a2c52">Donate with <tspan fill="#0070e0">PayPal</tspan></text>
  <text class="t" x="92" y="64" font-size="13.5" font-weight="600" fill="#a8607c">a cup of tea prevents brain overflow</text>
</svg>
