<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Floorplan Trailer</title>
<meta name="description" content="3D Floorplan für Home Assistant in knapp zwei Minuten: dein Zuhause in 3D, live. 3D Floorplan for Home Assistant in under two minutes: your home in 3D, live.">
<meta property="og:title" content="3D Floorplan für Home Assistant – Trailer">
<meta property="og:description" content="Dein Zuhause in 3D, live aus Home Assistant. Kostenlos und Open Source.">
<meta property="og:image" content="trailer-de.jpg">
<meta property="og:video" content="trailer-de.mp4">
<meta property="og:video:type" content="video/mp4">
<meta name="twitter:card" content="summary_large_image">
<!-- The page of the trailer (tools/make_trailer.py). The workflow "Demo" copies it next to the films of the branch trailer-video:
     trailer-<lang>.mp4 (landscape), trailer-<lang>-9x16.mp4 (upright), trailer-<lang>.jpg (picture);
     the short clips for TikTok, Reels and Shorts (tools/make_clips.py) in clips/: <id>-<lang>.mp4, <id>-<lang>.jpg and clips.json
     (their week in the plan of the posts, the first words, the text with the hashtags). -->
<style>
:root {
  color-scheme: dark;
  --bg: #080b16; --surface: #121726; --line: #232a3d; --text: #eef0f5; --text-2: #b9bfcc; --muted: #868d9c; --accent: #56a8ff;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { color-scheme: light; --bg: #f4f5f8; --surface: #ffffff; --line: #dfe2ea; --text: #12141a; --text-2: #454a57; --muted: #767c8a; --accent: #2a78d6; }
}
:root[data-theme="light"] { color-scheme: light; --bg: #f4f5f8; --surface: #ffffff; --line: #dfe2ea; --text: #12141a; --text-2: #454a57; --muted: #767c8a; --accent: #2a78d6; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px 48px; }
h1 { font-size: clamp(26px, 4vw, 40px); line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.02em; }
p.lead { color: var(--text-2); margin: 0 0 20px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; color: var(--text-2); padding: 6px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.stage { background: #000; border-radius: 18px; overflow: hidden; box-shadow: 0 20px 60px rgba(0, 0, 0, .35); margin: 0 auto; }
.stage video { display: block; width: 100%; height: auto; background: #000; }
.stage.up { max-width: 420px; }
.links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.links a { display: inline-flex; gap: 8px; align-items: center; padding: 10px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line);
  color: var(--text); text-decoration: none; }
.links a.main { background: var(--accent); border-color: var(--accent); color: #fff; }
.note { color: var(--muted); font-size: 14px; margin-top: 14px; }
.missing { padding: 60px 20px; text-align: center; color: var(--muted); }
#clipsBox { margin-top: 44px; }
#clipsBox h2 { font-size: clamp(22px, 3vw, 30px); margin: 0 0 6px; letter-spacing: -0.01em; }
.clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
.clip { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
.clip video, .clip .missing { display: block; width: 100%; aspect-ratio: 9 / 16; background: #000; object-fit: cover; }
.clip .missing { padding: 0; display: flex; align-items: center; justify-content: center; }
.clip .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.clip .when { color: var(--accent); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.clip .hook { font-weight: 700; line-height: 1.3; }
.clip .text { color: var(--text-2); font-size: 14px; white-space: pre-wrap; margin: 0; }
.clip .acts { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
.clip .acts a, .clip .acts button { flex: 1; display: inline-flex; justify-content: center; gap: 6px; padding: 9px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 14px; text-decoration: none; cursor: pointer; }
.clip .acts a { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (max-width: 600px) {          /* a phone: the video on the left, the words beside it (a whole card stays on the screen) */
  .clip { flex-direction: row; }
  .clip video, .clip .missing { width: 42%; flex: none; align-self: flex-start; }
  .clip .body { padding: 10px 12px; min-width: 0; }
  .clip .text { font-size: 13px; }
  .clip .hook { font-size: 15px; }
  .clip .when { font-size: 12px; }
  .clip .acts { flex-direction: column; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="h">3D Floorplan für Home Assistant</h1>
  <p class="lead" id="lead">Dein Zuhause in 3D, live – in knapp zwei Minuten.</p>
  <div class="bar">
    <div class="seg" role="group" aria-label="Sprache / language">
      <button type="button" data-lang="de">Deutsch</button><button type="button" data-lang="en">English</button>
    </div>
    <div class="seg" role="group" aria-label="Format">
      <button type="button" data-fmt="">16:9</button><button type="button" data-fmt="-9x16">9:16</button>
    </div>
  </div>
  <div class="stage" id="stage"><video id="v" controls playsinline preload="metadata"></video></div>
  <div class="links">
    <a class="main" id="dl" download>⬇ <span id="dlt">Video herunterladen</span></a>
    <a href="../" id="demo">▶ <span id="demot">Live-Demo ausprobieren</span></a>
    <a href="../guide/" id="guide">🎬 <span id="guidet">Video-Anleitung</span></a>
    <a href="https://github.com/BuRnEd4AiM/HA-Floorplanner">GitHub</a>
  </div>
  <p class="note" id="note"></p>
  <section id="clipsBox" hidden>
    <h2 id="ch"></h2>
    <p class="lead" id="cl"></p>
    <div class="clips" id="clips"></div>
  </section>
</div>
<script>
const T = {
  de: { h: '3D Floorplan für Home Assistant', lead: 'Dein Zuhause in 3D, live – in knapp zwei Minuten.', dl: 'Video herunterladen', demo: 'Live-Demo ausprobieren',
        guide: 'Video-Anleitung', note: '16:9 für YouTube, Foren und Reddit, 9:16 für Instagram, TikTok und Shorts. Die Musik ist selbst gemacht: frei zum Teilen.',
        missing: 'Dieses Video ist noch nicht da.',
        ch: 'Kurze Clips für TikTok, Reels und Shorts', cl: 'Je eine Funktion, hochkant, mit eigener Musik. Video herunterladen, Text kopieren, posten.',
        week: 'Woche', days: ['Dienstag', 'Donnerstag', 'Sonntag'], video: 'Video', copy: 'Text kopieren', copied: 'Kopiert ✓' },
  en: { h: '3D Floorplan for Home Assistant', lead: 'Your home in 3D, live – in under two minutes.', dl: 'Download the video', demo: 'Try the live demo',
        guide: 'Video guide', note: '16:9 for YouTube, forums and Reddit, 9:16 for Instagram, TikTok and Shorts. The music is our own: free to share.',
        missing: 'This video is not there yet.',
        ch: 'Short clips for TikTok, Reels and Shorts', cl: 'One feature each, upright, with our own music. Download the video, copy the text, post it.',
        week: 'Week', days: ['Tuesday', 'Thursday', 'Sunday'], video: 'Video', copy: 'Copy text', copied: 'Copied ✓' },
};
const q = new URLSearchParams(location.search);
let lang = q.get('lang') || ((navigator.language || 'de').startsWith('de') ? 'de' : 'en');
let fmt = q.get('fmt') === '9x16' ? '-9x16' : '';
const $ = (s) => document.querySelector(s);
function show() {
  const t = T[lang] || T.de, name = `trailer-${lang}${fmt}`;
  document.documentElement.lang = lang;
  $('#h').textContent = t.h; $('#lead').textContent = t.lead; $('#dlt').textContent = t.dl; $('#demot').textContent = t.demo;
  $('#guidet').textContent = t.guide; $('#note').textContent = t.note;
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelectorAll('[data-fmt]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.fmt === fmt));
  $('#stage').classList.toggle('up', fmt !== '');
  const v = $('#v');
  v.poster = `trailer-${lang}.jpg`;
  v.src = `${name}.mp4`;
  v.onerror = () => { $('#stage').innerHTML = `<div class="missing">${t.missing}</div>`; };
  $('#dl').href = `${name}.mp4`;
  $('#dl').setAttribute('download', `3D-Floorplan-${name}.mp4`);
}
document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; location.replace(`?lang=${lang}${fmt ? '&fmt=9x16' : ''}`); }));
document.querySelectorAll('[data-fmt]').forEach((b) => b.addEventListener('click', () => { fmt = b.dataset.fmt; location.replace(`?lang=${lang}${fmt ? '&fmt=9x16' : ''}`); }));
show();

// the short clips (clips/clips.json): their video, the week and day of the plan, the first words and the text to copy
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* an old browser or no permission: the old way */ }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
fetch('clips/clips.json').then((r) => (r.ok ? r.json() : null)).then((data) => {
  const list = (data && data.clips) || [];
  if (!list.length) return;
  const t = T[lang] || T.de, box = $('#clips');
  $('#ch').textContent = t.ch; $('#cl').textContent = t.cl;
  list.slice().sort((a, b) => a.week - b.week || a.day - b.day).forEach((c) => {
    const card = el('article', 'clip'), name = `clips/${c.id}-${lang}`;
    const v = el('video');
    v.controls = true; v.playsInline = true; v.preload = 'none'; v.poster = `${name}.jpg`; v.src = `${name}.mp4`;
    v.onerror = () => v.replaceWith(el('div', 'missing', t.missing));
    const body = el('div', 'body');
    body.append(el('div', 'when', `${t.week} ${c.week} · ${t.days[c.day] || ''} · ${Math.round(c.seconds)} s`),
      el('div', 'hook', (c.hook || {})[lang] || ''), el('p', 'text', (c.text || {})[lang] || ''));
    const acts = el('div', 'acts'), dl = el('a', '', `⬇ ${t.video}`), cp = el('button', '', `📋 ${t.copy}`);
    dl.href = `${name}.mp4`; dl.setAttribute('download', `3D-Floorplan-${c.id}-${lang}.mp4`);
    cp.type = 'button';
    cp.addEventListener('click', async () => {
      if (await copyText((c.text || {})[lang] || '')) { cp.textContent = t.copied; setTimeout(() => { cp.textContent = `📋 ${t.copy}`; }, 1800); }
    });
    acts.append(dl, cp);
    body.append(acts);
    card.append(v, body);
    box.append(card);
  });
  $('#clipsBox').hidden = false;
}).catch(() => {});
</script>
</body>
</html>
