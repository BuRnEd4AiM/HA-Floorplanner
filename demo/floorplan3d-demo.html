<!DOCTYPE html>
<html lang="de" data-theme="holo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Floorplan</title>
<style>:root, [data-theme="holo"] {
  --bg: #050d1c; --panel: rgba(9, 24, 48, .78); --line: rgba(61, 242, 255, .28); --text: #dff6ff; --muted: #7fb5d6;
  --field: rgba(24, 68, 128, .42); --accent: #23e0ff; --accent-text: #012230; --ok: #ff9d2e;
  --glow: 0 0 14px rgba(35, 224, 255, .45);
}
[data-theme="dark"] {
  --bg: #0f1419; --panel: #182028; --line: #2a3541; --text: #e6edf3; --muted: #8b98a5;
  --field: #222c36; --accent: #3fa9f5; --accent-text: #04121f; --ok: #2e7d4f;
  --scene: #0f1419; --glow: none;
}
[data-theme="light"] {
  --bg: #eef1f4; --panel: #ffffff; --line: #d5dbe1; --text: #1b2733; --muted: #62707d;
  --field: #f3f5f7; --accent: #1f8de0; --accent-text: #ffffff; --ok: #2e7d4f;
  --scene: #e9edf1; --glow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { display: flex; flex-direction: column; height: 100%; }
#toolbar { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; padding: 8px 12px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
.group { display: flex; gap: 4px; align-items: center; }
.group.right { margin-left: auto; gap: 10px; }
button, select, input { font: inherit; color: var(--text); background: var(--field);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button.primary { background: var(--ok); border-color: var(--ok); color: #fff; }
button.icon { padding: 4px 10px; font-size: 18px; line-height: 1; }
#status { position: fixed; left: 12px; bottom: 52px; z-index: 30; color: var(--text, #eaf7ff); font-size: 12px; padding: 4px 12px; border-radius: 999px; background: rgba(3, 21, 71, .72); border: 1px solid rgba(120,200,255,.35); pointer-events: none; }
#status:empty { display: none; }
main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; min-width: 0; position: relative; }
#view { width: 100%; height: 100%; display: block; touch-action: none; }
#panel { width: var(--panel-w, 290px); flex: none; overflow-y: auto; padding: 12px; background: var(--panel); border-left: 1px solid var(--line); }
#panel h3 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
#panel section:first-child h3 { margin-top: 0; }
#panel p { margin: 0; }
#panel input, #panel select { width: 100%; }
#entitySelect { margin-top: 6px; padding: 4px; }
.keys { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
.palette { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.palette.two { grid-template-columns: repeat(2, 1fr); }
.palette button { padding: 8px 4px; font-size: 12px; text-align: center; overflow: hidden; text-overflow: ellipsis; }
.palette .none { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.palette .model { position: relative; padding-right: 18px; }
.palette .model .x { position: absolute; top: 1px; right: 4px; color: var(--muted); font-weight: 700; }
.uploadBtn { display: block; margin-top: 8px; padding: 6px; text-align: center; cursor: pointer;
  border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); font-size: 13px; }
.uploadBtn:hover { border-color: var(--accent); color: var(--text); }
.prop { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.prop label { flex: 0 0 90px; color: var(--muted); }
.prop input[type=number], .prop input[type=text], .prop input[type=color], .prop select { flex: 1; min-width: 0; }
.prop input[type=color] { padding: 0; height: 30px; }

#livePopup { position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%); min-width: 240px;
  max-width: calc(100% - 24px); padding: 12px 14px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
#livePopup .title { font-weight: 600; }
#livePopup .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
#livePopup .actions { display: flex; gap: 6px; flex-wrap: wrap; }
#livePopup .actions button { flex: 1; min-height: 40px; }

dialog { color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 18px 20px; width: min(440px, calc(100% - 24px)); }
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog h2 { margin: 0 0 4px; font-size: 18px; }
dialog h3 { margin: 16px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
dialog .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
dialog .row label { flex: 1; }
dialog .row select, dialog .row input[type=number] { width: 150px; }
dialog .row.check { gap: 8px; }
dialog .row.check input { width: auto; }
dialog menu { margin: 16px 0 0; padding: 0; display: flex; justify-content: flex-end; }

body.live .edit-only, body.live #panel { display: none; }
body.kiosk #toolbar { display: none; }
@media (max-width: 800px) {
  main { flex-direction: column; }
  #panel { width: 100%; max-height: 35%; border-left: 0; border-top: 1px solid var(--line); }
}

/* ---------- navigation pills over the scene ---------- */
#navBar { position: absolute; top: 10px; left: 12px; right: 12px; z-index: 4; display: flex; gap: 8px;
  align-items: center; pointer-events: none; overflow-x: auto; scrollbar-width: none; padding: 4px 2px; }
#navBar::-webkit-scrollbar { display: none; }
#navBar > * { pointer-events: auto; flex: 0 0 auto; }
#navBar .pills { display: flex; gap: 8px; }
#navBar .spacer { flex: 1 1 auto; pointer-events: none; }
#navBar .sep { width: 1px; height: 26px; background: var(--line); }
.pill { border-radius: 999px; padding: 7px 16px; background: var(--panel); border: 1px solid var(--line);
  color: var(--text); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.pill.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; box-shadow: var(--glow); }

/* ---------- hologram look for the rest of the UI ---------- */
html[data-theme="holo"], html[data-theme="holo"] body { background: #041a52; }
[data-theme="holo"] #toolbar, [data-theme="holo"] #panel, [data-theme="holo"] dialog, [data-theme="holo"] #livePopup {
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
[data-theme="holo"] #toolbar { border-bottom-color: var(--line); box-shadow: 0 1px 18px rgba(35, 224, 255, .12); }
[data-theme="holo"] button, [data-theme="holo"] select, [data-theme="holo"] input { border-radius: 999px; }
[data-theme="holo"] select[size], [data-theme="holo"] #entitySelect { border-radius: 12px; }
[data-theme="holo"] button:hover { box-shadow: var(--glow); }
[data-theme="holo"] button.active { box-shadow: var(--glow); }
[data-theme="holo"] button.primary { color: #2a1400; font-weight: 600; box-shadow: 0 0 14px rgba(255, 157, 46, .45); }
[data-theme="holo"] #livePopup { border-color: var(--line); box-shadow: 0 0 30px rgba(35, 224, 255, .25); border-radius: 22px; }
[data-theme="holo"] #livePopup .actions button { border-radius: 999px; }
[data-theme="holo"] .palette button { border-radius: 14px; }
[data-theme="holo"] .uploadBtn { border-radius: 14px; }
[data-theme="holo"] dialog { border-radius: 22px; box-shadow: 0 0 40px rgba(35, 224, 255, .25); }
[data-theme="holo"] #panel h3, [data-theme="holo"] dialog h3 { color: #4fd8ff; }

/* Room detail panel (live mode): entities grouped by type with sliders */
#roomPanel { position: absolute; top: 58px; right: 12px; bottom: 12px; width: 300px; max-width: calc(100% - 24px);
  overflow-y: auto; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  z-index: 5; box-shadow: 0 0 30px rgba(35,224,255,.2); }
#roomPanel .rp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
#roomPanel .rp-head b { font-size: 18px; }
#roomPanel .rp-x { background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; }
#roomPanel h4 { margin: 14px 0 6px; font-size: 11px; letter-spacing: .12em; color: var(--muted); }
#roomPanel .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 10px; margin-bottom: 6px;
  border: 1px solid var(--line); border-radius: 12px; }
#roomPanel .row.on { border-color: #ff9d2e; box-shadow: 0 0 12px rgba(255,157,46,.35); }
#roomPanel .row .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#roomPanel .row .v { color: var(--muted); font-size: 12px; }
#roomPanel .row input[type=range] { flex: 1 1 100%; accent-color: var(--accent); }
#roomPanel .row button { min-height: 30px; border-radius: 999px; padding: 2px 12px; }

/* Hologram backdrop: royal-blue gradient with a teal glow in the corner (reference video) */
html[data-theme="holo"] #stage {
  background:
    radial-gradient(circle at 92% 12%, color-mix(in srgb, var(--bg-glow, #28ebd2) 55%, transparent) 0, color-mix(in srgb, var(--bg-glow, #28ebd2) 12%, transparent) 9%, transparent 22%),
    linear-gradient(180deg, var(--bg-top, #0a3ba8) 0%, color-mix(in srgb, var(--bg-top, #0a3ba8) 55%, var(--bg-bottom, #031547)) 45%, var(--bg-bottom, #031547) 100%);
}
#modeBar { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 4; }
body.kiosk #modeBar { bottom: 10px; }

dialog { max-height: 90vh; overflow-y: auto; }
dialog .row input[type=color] { width: 150px; height: 30px; padding: 0; }
dialog .stop { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
dialog .stop input[type=number] { width: 90px; }
dialog .stop input[type=color] { width: 60px; height: 28px; padding: 0; }
dialog .stop button { min-width: 28px; }
dialog .stopBar { height: 10px; border-radius: 5px; margin: 8px 0; }
dialog .stopTools { display: flex; gap: 8px; }

#openPill.alert { background: #ff4a3d; border-color: #ff4a3d; color: #fff; box-shadow: 0 0 14px rgba(255,74,61,.7); }
#roomPanel .row.alert { border-color: #ff4a3d; box-shadow: 0 0 12px rgba(255,74,61,.4); }

/* Room tablet: locked to one room; the button in the nav bar switches between the room and the whole floor */
body.roomtablet.iso #floorPills, body.roomtablet.iso #roomPills, body.roomtablet.iso #navSep { display: none; }
body.roomtablet #houseToggle { font-weight: 600; }
body.roomtablet #roomPanel { top: 58px; }
dialog .hint { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
dialog .stop.tablet input[type=text] { flex: 1; min-width: 0; width: auto; }
dialog .stop.tablet select { width: 130px; }

#livePopup .lightctl { margin-top: 10px; }
#livePopup .lightctl input[type=range] { width: 100%; }
#livePopup .swatches { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; align-items: center; }
#livePopup .sw { width: 30px; height: 30px; min-height: 0; padding: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); }
#livePopup .sw-pick { width: 34px; height: 34px; padding: 0; border: 2px solid rgba(255,255,255,.5); border-radius: 50%; background: none; }

.roomEnts h4 { margin: 12px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent, #23e0ff); }
.re-row { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; padding: 6px 8px; margin-bottom: 4px; border: 1px solid rgba(120,200,255,.25); border-radius: 10px; }
.re-row.placed { cursor: pointer; }
.re-row.placed:hover { background: rgba(35,224,255,.12); }
.re-row.unplaced { border-style: dashed; opacity: .85; }
.re-n { font-weight: 600; flex: 1 1 100%; }
.re-s { font-size: 11px; color: var(--muted); flex: 1; word-break: break-all; }
.re-row button { min-height: 28px; padding: 2px 10px; }
.entState { font-size: 11px; color: var(--muted); margin-top: 4px; word-break: break-all; }

#objList details { margin-bottom: 6px; }
#objList summary { cursor: pointer; font-size: 12px; color: var(--muted); padding: 4px 0; }
#objList .obj { display: block; width: 100%; text-align: left; min-height: 30px; padding: 4px 10px; margin: 2px 0; border-radius: 8px; font-size: 13px; }
#objList .obj.active { border-color: var(--accent, #23e0ff); background: rgba(35,224,255,.18); font-weight: 600; }
#objListBody { max-height: 34vh; overflow: auto; }

#objList .lockbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); padding: 4px 2px 8px; }
#objList .lockbar.on { color: #ffb04a; }
#objList .lockbar button { min-height: 26px; padding: 2px 10px; }
body.locksel #view, body.locksel canvas { cursor: move; }

.re-row.active { border-color: var(--accent, #23e0ff); background: rgba(35,224,255,.18); }

/* 2D blueprint editor */
#plan2d { position: absolute; inset: 0; z-index: 2; touch-action: none; user-select: none; }
#plan2d[hidden] { display: none; }
#plan2d .plan-svg { width: 100%; height: 100%; display: block; font-family: inherit; }
body.v-2d #view { visibility: hidden; }
body.v-split #plan2d { right: 50%; border-right: 1px solid rgba(120,200,255,.35); }
body.v-split #view { position: absolute; left: 50%; top: 0; width: 50%; height: 100%; }
body.v-split #plan2d { background: rgba(3, 21, 71, .35); }
body.v-2d #plan2d { background: rgba(3, 21, 71, .35); }
#plan2d { cursor: default; }
body[data-tool="wall"] #plan2d, body[data-tool="room"] #plan2d, body[data-tool="device"] #plan2d, body[data-tool="opening"] #plan2d { cursor: crosshair; }
body.live #plan2d { cursor: pointer; }

body:not(.live) #roomPanel { display: none !important; }   /* edit mode: the side panel already lists the room's entities */

.prop.stack { flex-direction: column; align-items: stretch; gap: 4px; }
.prop.stack > label { flex: none; }
.entPicker { display: flex; flex-direction: column; gap: 4px; min-width: 0; width: 100%; }
.entPicker input { width: 100%; min-width: 0; box-sizing: border-box; }
.entCur { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; overflow-wrap: anywhere; line-height: 1.25; }
.entCur b { display: block; font-weight: 600; }
.entCur small, .entItem small { display: block; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
.entCur.none { color: var(--muted); }
.entList { max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.entGroup { position: sticky; top: 0; padding: 4px 8px; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--accent); background: var(--panel); }
.entItem { padding: 6px 8px; cursor: pointer; overflow-wrap: anywhere; line-height: 1.25; }
.entItem:hover, .entItem.sel { background: rgba(120, 200, 255, .16); }
.entEmpty { padding: 6px 8px; color: var(--muted); }
#roomEntSearch { width: 100%; box-sizing: border-box; margin: 2px 0 8px; }
.re-row[hidden] { display: none; }
body.viewlock #view2d, body.viewlock #view3d, body.viewlock #viewSplit { display: none; }
#tabletRows .tablet { display: grid; grid-template-columns: 1.2fr 1fr 1fr auto; gap: 6px; }
#tabletRows .tablet input, #tabletRows .tablet select { min-width: 0; width: 100%; box-sizing: border-box; }
.roomctl { margin-top: 12px; padding-top: 8px; border-top: 1px solid rgba(120,200,255,.25); }
.roomctl h4 { margin: 0 0 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent, #23e0ff); }
.scenes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.scenes button { flex: 0 1 auto; }
.fxsel { width: 100%; margin-top: 4px; }

/* background image panel */
#bgPanel { margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
#bgPanel > summary { cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
#bgPanel[open] > summary { margin-bottom: 8px; }
#bgBody .sub { margin: 8px 0 0; }
#bgBody input[type=range] { flex: 1; min-width: 0; }
#bgBody .stopTools button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
[data-theme="holo"] #bgPanel { border-radius: 14px; }
#plan2d.bgmode { cursor: crosshair; }
body.readonly #bgPanel { display: none; }

/* block / stair palettes */
#stairPalette .palette, #blockPalette .prop { margin-bottom: 8px; }
#stairPalette .palette button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
#stairPalette .sub, #blockPalette .sub { margin: 8px 0 0; }

/* furniture library */
#paletteSearch { width: 100%; margin-bottom: 6px; }
#paletteCats { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
#paletteCats button { padding: 3px 9px; font-size: 11px; border-radius: 999px; }
#paletteCats button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.palette.thumbs button.dev { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px; }
.palette.thumbs button.dev img { width: 56px; height: 56px; object-fit: contain; pointer-events: none; }
.palette.thumbs button.dev span { font-size: 11px; line-height: 1.15; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette.thumbs button.dev.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

#houseSelect { max-width: 190px; }
body.kiosk #houseGroup { display: none; }
#backupExport { display: inline-block; text-decoration: none; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; }
#backupExport:hover { border-color: var(--accent); }
#housePanel h4 { margin: 12px 0 4px; }
.objrow { display: flex; align-items: center; gap: 6px; }
.objrow .obj { flex: 1; }
.objlock { width: auto; padding: 0; margin: 0; accent-color: var(--accent); }
.objrow .obj.locked { opacity: .75; font-style: italic; }
#objList .objrow .obj { width: auto; }
#panel input[type=checkbox] { width: auto; flex: none; }
#objList .objrow .objlock { width: 16px; height: 16px; flex: none; }
#objList .objrow .obj { flex: 1; min-width: 0; width: auto; }
#panelResizer { width: 7px; flex: none; cursor: col-resize; background: transparent; border-left: 1px solid var(--line); touch-action: none; }
#panelResizer:hover, #panelResizer.drag { background: var(--accent); opacity: .5; }
body.live #panelResizer { display: none; }
@media (max-width: 700px) { #panelResizer { display: none; } }
#houseGroup[hidden] { display: none; }
#objList .objfilter { width: 100%; margin: 6px 0; }
dialog .dlgHead { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; margin: 0 -20px 4px; padding: 16px 20px 8px; background: var(--bg); border-bottom: 1px solid var(--line); }
dialog .dlgHead h2 { margin: 0; }
dialog .dlgClose { width: 34px; height: 34px; padding: 0; border-radius: 50%; font-size: 16px; line-height: 1; flex: none; }
#settingsDialog { padding-top: 0; }

/* Nanoleaf layout editor */
#nanoDialog { width: min(760px, 96vw); }
#nanoDialog .hint { margin: 6px 0; opacity: .8; font-size: 13px; }
.nanoBar, .nanoFoot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
.nanoBar .sep, .nanoFoot .grow { flex: 1; }
.nanoBar .sep { flex: 0 0 10px; }
.nanoBar button.on { background: var(--accent); color: #001; }
#nanoCanvas { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; touch-action: none; cursor: crosshair; }
#roomPanel .row .rp-more { padding: 4px 8px; }
#roomPanel .row .rp-more.on { border-color: var(--accent); box-shadow: 0 0 8px var(--accent); }
#roomPanel .row .rp-ctl { flex: 1 1 100%; }

.demo-badge{position:fixed;left:12px;bottom:12px;z-index:5;padding:5px 10px;border-radius:999px;font-size:12px;
background:var(--panel);border:1px solid var(--line);color:var(--muted);pointer-events:none}</style>
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="group" id="modeSwitch">
      <button data-mode="edit" class="active" data-i18n="mode.edit"></button>
      <button data-mode="live" data-i18n="mode.live" data-i18n-title="mode.liveTip"></button>
    </div>
    <div class="group edit-only" id="tools">
      <button data-tool="select" class="active" data-i18n="tool.select" data-i18n-title="tip.select"></button>
      <button data-tool="wall" data-i18n="tool.wall" data-i18n-title="tip.wall"></button>
      <button data-tool="room" data-i18n="tool.room" data-i18n-title="tip.room"></button>
      <button data-tool="block" data-i18n="tool.block" data-i18n-title="tip.block"></button>
      <button data-tool="stairs" data-i18n="tool.stairs" data-i18n-title="tip.stairs"></button>
      <button data-tool="opening" data-i18n="tool.opening" data-i18n-title="tip.opening"></button>
      <button data-tool="device" data-i18n="tool.device" data-i18n-title="tip.device"></button>
      <button data-tool="group" data-i18n="tool.group" data-i18n-title="tip.group"></button>
      <button data-tool="erase" data-i18n="tool.erase" data-i18n-title="tip.erase"></button>
    </div>
    <div class="group">
      <button id="view2d" data-i18n="view.2d"></button>
      <button id="view3d" class="active" data-i18n="view.3d"></button>
