name: Release

# Publishes GitHub releases with the notes from CHANGELOG.md.
#  - automatically when a push to main changes the version in floorplan3d/config.yaml,
#  - push a tag such as v0.8.0, or
#  - Actions → "Release" → Run workflow (optionally with "backfill" to also fill old gaps).
# Several merges in a row used to skip versions: GitHub keeps only one waiting run per queue and cancels the others. Every run therefore
# creates ALL missing releases (tools/release_versions.py, tested): the versions in the changelog newer than the newest release, each tagged
# at the commit that brought that version into config.yaml, oldest first; only the version in config.yaml becomes "latest".
on:
  push:
    branches: [main]
    paths: ["floorplan3d/config.yaml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v, e.g. 0.8.0 (empty = the one in floorplan3d/config.yaml)"
        required: false
      backfill:
        description: "Also create releases for older versions that were skipped"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:                    # its own queue: a cancelled waiting run loses nothing, the next one catches up
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the missing releases
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          set -euo pipefail
          cfg="$(sed -n 's/^version: "\(.*\)"/\1/p' floorplan3d/config.yaml)"
          v="${INPUT_VERSION:-}"; v="${v#v}"
          if [ -n "$v" ] && [ "$v" != "$cfg" ]; then echo "config.yaml says $cfg, not $v"; exit 1; fi
          tags="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate -q '.[].tag_name')"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            todo="${GITHUB_REF_NAME#v}"
            echo "$tags" | grep -qx "v$todo" && todo=""
          else
            bf=""; if [ "${BACKFILL:-false}" = "true" ]; then bf="--backfill"; fi
            todo="$(python3 tools/release_versions.py "$cfg" $bf $tags)"
          fi
          [ -n "$todo" ] || { echo "Nothing to release"; exit 0; }
          for ver in $todo; do
            notes="$(awk -v v="$ver" '$0 ~ "^## \\["v"\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md)"
            [ -n "$notes" ] || { echo "No CHANGELOG entry for $ver, skipped"; continue; }
            # the commit that set this version in config.yaml (the oldest match; tail reads all, head would break the pipe)
            target="$(git log --format=%H -S"version: \"$ver\"" -- floorplan3d/config.yaml | tail -1)"
            if [ -z "$target" ]; then
              # a version that only has a CHANGELOG entry (bundled into a later version) was never shipped: no release
              [ "$ver" = "$cfg" ] || { echo "v$ver was never in config.yaml, skipped"; continue; }
              target="$GITHUB_SHA"
            fi
            latest=false; [ "$ver" = "$cfg" ] && latest=true
            # the dashboard card of that commit goes into the release itself: once a release has files attached (the demo), HACS
            # downloads only those (#348). gh uploads them before it publishes the release, so HACS never sees it without the card.
            card=()
            if git show "$target:dist/floorplan3d-card.js" > "$RUNNER_TEMP/floorplan3d-card.js" 2>/dev/null; then card=("$RUNNER_TEMP/floorplan3d-card.js"); fi
            echo "Release v$ver at $target (latest: $latest, card: ${#card[@]})"
            gh release create "v$ver" ${card[@]+"${card[@]}"} --target "$target" --title "3D Floorplan $ver" --notes "$notes" --latest="$latest" || echo "v$ver could not be created"
          done
      - name: The release of this version carries the dashboard card
        # also for a release made before the card was attached (Actions -> Release -> Run workflow repairs it); HACS needs it (#348)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(sed -n 's/^version: "\(.*\)"/\1/p' floorplan3d/config.yaml)"
          [ -f dist/floorplan3d-card.js ] || exit 0
          names="$(gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null)" || { echo "no release $tag yet"; exit 0; }
          echo "$names" | grep -qx floorplan3d-card.js && { echo "$tag has the card"; exit 0; }
          gh release upload "$tag" dist/floorplan3d-card.js --clobber

  demo:
    needs: release
    runs-on: ubuntu-latest
    concurrency:                    # shares the queue with the Demo workflow, which attaches the same demo file (never both at once)
      group: release-assets
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build and attach the single-file demo to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" -q .tag_name 2>/dev/null || true)"
          [ -n "$tag" ] || exit 0
          (cd demo && npm ci && npm run build)
          gh release upload "$tag" demo/floorplan3d-demo.html --clobber || true
