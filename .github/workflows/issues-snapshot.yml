name: Issues snapshot

# Writes all open issues, pull requests and milestones into .github/ISSUES_SNAPSHOT.md so they can be read together with the code
# (for example by an AI assistant that has no access to the GitHub website). Run it manually: Actions -> "Issues snapshot" -> Run workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=.github/ISSUES_SNAPSHOT.md
          {
            echo "# Issues snapshot"
            echo
            echo "Generated by the *Issues snapshot* workflow on $(date -u +%Y-%m-%d). Do not edit by hand."
            echo
            echo "## Milestones"
            gh api "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" --jq '.[] | "- **\(.title)** (\(.state), \(.open_issues) open / \(.closed_issues) closed): \(.description // "")"'
            echo
            echo "## Open issues"
            gh issue list --state open --limit 200 --json number,title,labels,milestone,author,body,createdAt --jq '.[] | "### #\(.number) \(.title)\n- milestone: \(.milestone.title // "none") · labels: \([.labels[].name] | join(", ")) · by \(.author.login) · \(.createdAt[:10])\n\n\((.body // "") | .[0:700])\n"'
            echo
            echo "## Open pull requests"
            gh pr list --state open --limit 100 --json number,title,author,headRefName --jq '.[] | "- #\(.number) \(.title) (\(.author.login), branch \(.headRefName))"'
            echo
            echo "## Recently closed issues"
            gh issue list --state closed --limit 30 --json number,title,closedAt --jq '.[] | "- #\(.number) \(.title) (\(.closedAt[:10]))"'
          } > "$out"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUES_SNAPSHOT.md
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Update issues snapshot"
          git push
