name: Demo

# Keeps the downloadable single-file demo current: whenever the app or the demo data changes on main it is rebuilt,
# committed (demo/floorplan3d-demo.html) and replaced in the latest release, so the download button always gives the newest one.
# Normal and Beta (5.3.1, the owner: "dass man die Beta auch testen kann, ohne dass man das installieren muss"): GitHub Pages and the
# latest release get the demo of the NORMAL add-on (floorplan3d-stable/, the released version); the beta's demo is under /beta/.
# "Release to everyone" (stable.yml) starts this workflow after a release, so the normal demo follows it.
on:
  push:
    branches: [main]
    paths:
      - "floorplan3d/rootfs/app/static/**"
      - "demo/**"
      - "CHANGELOG.md"                # the timeline page next to the demo (tools/make_timeline.py)
      - "docs/CHANGELOG.de.md"
      - "tools/make_timeline.py"
      - "tools/timeline.html"
      - "docs/ideen-*/**"
      - "docs/timeline/**"
      - "docs/tokens/**"              # every merge brings its token count: the timeline adds it up to that day
      - "docs/img/3d.jpg"
      - "tools/guide/page.html"         # the page of the video guide (its videos come from the branch guide-videos, workflow "Video guide")
      - "tools/guide/search.js"         # its search
      - "tools/guide/tags.py"           # more search words and words with the same meaning
      - "tools/make_guide.py"
      - "tools/trailer/page.html"       # the page of the trailer (its films come from the branch trailer-video, workflow "Trailer")
      - "tools/danke.html"              # hidden thank-you page for donations (return URL in PayPal), not linked anywhere
      - "!demo/floorplan3d-demo.html"
      - "floorplan3d-stable/**"         # the normal add-on (its release commit skips CI: stable.yml starts this workflow itself)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    concurrency:                    # the Release workflow attaches the same file: never both at once (it raced into a 404)
      group: release-assets
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build
        run: |
          cd demo && npm ci && npm run build                                      # the committed file: the beta's code, as before
          node build.mjs ../_demo/beta/floorplan3d-demo.html --beta              # GitHub Pages /beta/: the beta, saying so
          if ! node build.mjs ../_demo/stable/floorplan3d-demo.html --stable; then   # GitHub Pages and the download: the normal add-on
            echo "::warning::The normal add-on's code does not build with today's demo data: the page shows the beta's demo for now."
            mkdir -p ../_demo/stable && cp floorplan3d-demo.html ../_demo/stable/floorplan3d-demo.html
          fi
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/floorplan3d-demo.html
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild demo [skip ci]"
          for i in 1 2 3; do                    # "Token count" pushes to main right after a merge too: it raced, the push was refused (#458)
            git pull --rebase -q && git push && exit 0
            echo "push failed (attempt $i), retrying"; sleep $((i * 10))
          done
          exit 1
      - name: Collect the demo and the timeline for GitHub Pages
        run: |
          mkdir -p _site/beta && cp _demo/stable/floorplan3d-demo.html _site/index.html && cp _demo/beta/floorplan3d-demo.html _site/beta/index.html
          python3 tools/make_timeline.py _site
          cp tools/danke.html _site/danke.html   # hidden thank-you page for donations (return URL in PayPal)
      - name: The video guide next to the demo (guide/, videos from the branch guide-videos)
        run: |
          mkdir -p /tmp/guide-videos
          if git fetch -q --depth 1 origin guide-videos; then git archive FETCH_HEAD | tar -x -C /tmp/guide-videos; fi
          python3 tools/make_guide.py --site _site/guide --videos /tmp/guide-videos
      - name: The trailer next to the demo (trailer/, films from the branch trailer-video)
        run: |
          mkdir -p _site/trailer
          if git fetch -q --depth 1 origin trailer-video; then git archive FETCH_HEAD | tar -x -C _site/trailer; rm -f _site/trailer/README.md; fi
          cp tools/trailer/page.html _site/trailer/index.html
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Update the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          [ -n "$tag" ] || exit 0
          for i in 1 2 3; do
            gh release upload "$tag" _demo/stable/floorplan3d-demo.html --clobber && exit 0   # the latest release is the normal add-on's
            echo "upload failed (attempt $i), retrying"; sleep $((i * 10))
          done
          exit 1

  # Also run the demo straight on GitHub Pages (no download). Switch Pages on once: Settings -> Pages -> Source: GitHub Actions.
  # Until then this job only reports a warning and does not turn the workflow red.
  pages:
    needs: demo
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000            # 30 min (default 10): with the videos the site is over 900 MB; GitHub sometimes needs longer than 10 min
                                      # to take it ("syncing_files", 2026-11-09 23:09 and twice on 2026-11-10), at other times 30 s
