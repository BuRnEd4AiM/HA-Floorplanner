name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Stair geometry unit tests
        run: |
          mkdir -p /tmp/static && cp -r floorplan3d/rootfs/app/static/. /tmp/static/
          echo '{"type":"module"}' > /tmp/static/package.json
          STATIC_DIR=/tmp/static node --test tests/stairs.test.mjs
      - name: LED ring geometry unit tests
        run: |
          cp floorplan3d/rootfs/app/static/ledring.js /tmp/ledring.mjs
          LEDRING_MJS=/tmp/ledring.mjs node --test tests/ledring.test.mjs
      - name: Automatic placement unit tests
        run: |
          cp floorplan3d/rootfs/app/static/autoplace.js /tmp/autoplace.mjs
          AUTOPLACE_MJS=/tmp/autoplace.mjs node --test tests/autoplace.test.mjs
      - name: Warnings, night dimming and search unit tests
        run: |
          cp floorplan3d/rootfs/app/static/alerts.js /tmp/alerts.mjs
          ALERTS_MJS=/tmp/alerts.mjs node --test tests/alerts.test.mjs
      - name: Room detection unit tests
        run: |
          cp floorplan3d/rootfs/app/static/rooms.js /tmp/rooms.mjs
          ROOMS_MJS=/tmp/rooms.mjs node --test tests/rooms.test.mjs
      - name: Kitchen run unit tests
        run: |
          cp floorplan3d/rootfs/app/static/kitchen.js /tmp/kitchen.mjs
          KITCHEN_MJS=/tmp/kitchen.mjs node --test tests/kitchen.test.mjs
      - name: Compass unit tests
        run: |
          cp floorplan3d/rootfs/app/static/compass.js /tmp/compass.mjs
          COMPASS_MJS=/tmp/compass.mjs node --test tests/compass.test.mjs
      - name: Power add-on unit tests
        run: |
          mkdir -p /tmp/static && cp -r floorplan3d/rootfs/app/static/. /tmp/static/
          echo '{"type":"module"}' > /tmp/static/package.json
          STATIC_DIR=/tmp/static node --test tests/powerlogic.test.mjs
      - name: Heating panel unit tests
        run: |
          cp floorplan3d/rootfs/app/static/heatpanel.js /tmp/heatpanel.mjs
          HEAT_MJS=/tmp/heatpanel.mjs node --test tests/heatpanel.test.mjs
      - name: Unit tests of the split modules (time travel, offline, badges, kiosk, cameras, floor cards and rail, houses, settings, background, palettes, stair tool, live control, live card, properties, openings, cutaway, settings, floor panel, earth, room light, renamed entities, roller shutters, dormers, roof steps, the page in the dashboard card, the heaters, the offline signs, the device overview, the power bookkeeping, the camera live picture, the furniture in Scandinavian style, the sauna / fitness / bar / cinema pieces, the vehicles / workshop / garage pieces, the LED zones, the floors of the whole-house view, the merged parts of a model, the label sharpness and measuring, the strip kept clear of the iPhone's home bar, the values of a bar by finger, the cabinet builder)
        run: |
          mkdir -p /tmp/static && cp -r floorplan3d/rootfs/app/static/. /tmp/static/
          echo '{"type":"module"}' > /tmp/static/package.json
          for t in offline badges kiosk cameras floorcards floorrail houses settingsui background palettes stairtool livecontrols livepopup props openings settings floorpanel earth solarroof badgetext bridge roofs collide nav placement search planview multisel neighbor pickrules tapballs entitystate layoutnorm roomclip viewprefs livechannel persist floorbuild edititems picture draw3d appstate frameloop roofmove attic sheetview dormerwin phonenav phonestatus phonemenu wallsplit perfhud userlocks timeline startview bootguard renames shutters dormer roofsteps cardmode lamplight heating offlinemarks devicelist energycalc camlive scandi leisure garage ledzones tvmount housefloors meshmerge labels measure clipboard buildings energyprefs devicecontrols sky energyflow roomtiles toolicons floorcover facade dragscroll finishes patterns finishui setgroups notifyui guard lightgroups favorites shortcuts undotoast tabs today energyhistory climate routines family pagelayout pagevariants cards fullscreen media household thermostat sections calcard buttonlook energycounters voicequery voiceaudio voicediag batterylevels safearea bartip doorbell voicecommand car garden yard yarddeco closet rules scenes kelvin trains moon edges; do STATIC_DIR=/tmp/static node --test tests/$t.test.mjs; done
      - name: Tool bar unit tests
        run: |
          cp floorplan3d/rootfs/app/static/toolbar.js /tmp/toolbar.mjs
          TOOLBAR_MJS=/tmp/toolbar.mjs node --test tests/toolbar.test.mjs
      - name: Backups panel unit tests
        run: |
          cp floorplan3d/rootfs/app/static/backups.js /tmp/backups.mjs
          BACKUPS_MJS=/tmp/backups.mjs node --test tests/backups.test.mjs
      - name: Version panel unit tests
        run: |
          cp floorplan3d/rootfs/app/static/version.js /tmp/version.mjs
          VERSION_MJS=/tmp/version.mjs node --test tests/version.test.mjs
      - name: Welcome card unit tests
        run: |
          cp floorplan3d/rootfs/app/static/welcome.js /tmp/welcome.mjs
          WELCOME_MJS=/tmp/welcome.mjs node --test tests/welcome.test.mjs
      - name: Dashboard card unit tests
        run: node --test tests/card.test.mjs
      - name: Check frontend syntax
        run: |
          for f in floorplan3d/rootfs/app/static/*.js; do cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs; done
          node --check dist/floorplan3d-card.js

  container:
    # the Docker version without the Supervisor (#489, container/): the image builds, starts and sends whoever is not logged in to
    # Home Assistant's login (HA_URL is a name only the Docker network knows: the browser gets the host it opened the page with)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f container/Dockerfile -t floorplan3d .
      - run: |
          docker run -d --name fp -p 8100:8099 -e HA_URL=http://homeassistant:8123 -e HA_TOKEN=x floorplan3d
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8100/auth/login && break; sleep 1; done
          curl -s -o /dev/null -w "%{http_code} %{redirect_url}\n" http://localhost:8100/ | tee /tmp/page
          grep -q "^302 http://localhost:8100/auth/login$" /tmp/page
          curl -s -o /dev/null -w "%{redirect_url}\n" http://localhost:8100/auth/login | tee /tmp/login
          grep -q "^http://localhost:8123/auth/authorize?response_type=code&client_id=http%3A%2F%2Flocalhost%3A8100%2F&" /tmp/login
          test "$(curl -s -o /dev/null -w "%{http_code}" -H "X-Remote-User-Name: admin" http://localhost:8100/api/layout)" = 401
          docker exec fp test -s /data/.login_key
      - if: always()
        run: docker logs fp 2>&1 | tail -n 30

  changes:
    # no_browser: true when the change cannot alter what the browser sees: only text (*.md in docs/ or in the top folder, e.g. a test result in
    #   docs/TESTPROTOKOLL.md), the token counts (docs/tokens/*.json), the photos of the timeline page (docs/timeline/), unit tests
    #   (tests/*.mjs, tests/test_*.py) or tools/.
    #   The browser test is skipped then.
    # parts: the parts of the browser test (tests/e2e/parts/), each one runs as its own job below, all at the same time
    runs-on: ubuntu-latest
    outputs:
      no_browser: ${{ steps.check.outputs.no_browser }}
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          files=$(git diff --name-only "$BASE" HEAD 2>/dev/null) || files="unknown"
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^(docs/[^ ]*\.md|docs/tokens/[^/ ]*\.json|docs/timeline/[^ ]*|[^/ ]*\.md|tests/[^/ ]*\.(mjs|py)|tools/[^ ]*)$'; then no_browser=true; else no_browser=false; fi
          echo "no_browser=$no_browser" | tee -a "$GITHUB_OUTPUT"
      - id: parts
        run: echo "parts=$(python3 tests/e2e/test_e2e.py --json)" | tee -a "$GITHUB_OUTPUT"

  e2e-part:
    # drives the real interface in Chromium against the real server and a mock Home Assistant: every job builds the test house
    # (tests/e2e/parts/base.py) and runs ONE part of the checks, all parts at the same time (a few minutes instead of 13 one after the other)
    name: e2e ${{ matrix.part }}
    needs: changes
    if: needs.changes.outputs.no_browser != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.changes.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp playwright
      - name: Install Chromium (with a time limit and retries)
        # the Ubuntu package servers sometimes hang: one attempt hung 25 minutes and the whole job was cancelled before a test ran
        timeout-minutes: 20
        run: |
          # apt gives up on a mirror that does not answer instead of waiting forever, and tries again
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99timeouts
          # the runner's Microsoft package source is not needed for Chromium; when it answers 403, apt-get update fails and with it the install
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          # the browser itself comes from Playwright's own server, without apt
          for i in 1 2 3; do timeout --kill-after=15 300 playwright install chromium && break; echo "Chromium download attempt $i failed, trying again"; done
          starts() { python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()"; }
          # the runner image has Google Chrome and with it the libraries Chromium needs: then apt is not needed at all
          if starts; then echo "Chromium starts without more packages"; exit 0; fi
          for i in 1 2 3; do
            timeout --kill-after=15 360 playwright install-deps chromium && starts && exit 0
            echo "Chromium packages attempt $i failed or hung, trying again"
            # timeout stops playwright, not the apt-get it started (as root): stop a hung "apt-get update", wait until the package locks are free
            sudo pkill -f "apt-get update" || true
            for _ in $(seq 60); do sudo fuser /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1 || break; sleep 5; done
          done
          exit 1
      - name: Start the mock Home Assistant and the add-on
        run: |
          cd tests/e2e
          python make_glb.py
          echo '{"editors": ["admin"]}' > /tmp/opts.json
          nohup python mock_ha.py > /tmp/mock.log 2>&1 &
          DATA_DIR=$(mktemp -d) SUPERVISOR_TOKEN=x HA_API=http://localhost:8123 CALLMEBOT_URL=http://localhost:8123/_callmebot CALLMEBOT_TG=http://localhost:8123/_cmb DBF_URL=http://localhost:8123/_dbf OPTIONS_FILE=/tmp/opts.json \
            nohup python ../../floorplan3d/rootfs/app/server.py > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8099/ && break; sleep 1; done
      - name: Browser end-to-end tests (the test house and the part ${{ matrix.part }})
        run: |
          cd tests/e2e
          set -o pipefail
          python -u test_e2e.py ${{ matrix.part }} 2>&1 | tee /tmp/e2e.out
      - name: Failed checks and server log
        if: failure()
        run: |
          grep -E "^(FAIL|Traceback|.*Error)" /tmp/e2e.out | head -40 || true
          tail -n 30 /tmp/server.log /tmp/mock.log

  e2e:
    # one result for all parts of the browser test, under the old name "e2e" (a rule of the protected main branch may ask for it)
    needs: [changes, e2e-part]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PARTS: ${{ needs.e2e-part.result }}
          NO_BROWSER: ${{ needs.changes.outputs.no_browser }}
        run: |
          echo "browser test parts: $PARTS (nothing for the browser changed: $NO_BROWSER)"
          [ "$PARTS" = success ] || { [ "$PARTS" = skipped ] && [ "$NO_BROWSER" = true ]; }

  addon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: ./floorplan3d
