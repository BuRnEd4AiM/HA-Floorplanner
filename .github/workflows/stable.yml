name: Release to everyone

# Normal and Beta (5.2.0): every merged version goes to the beta add-on (floorplan3d/) at once. This workflow gives a version to EVERYONE:
# it copies floorplan3d/ as it was last at that version on main into floorplan3d-stable/ (the normal add-on, tools/stable.py), commits the
# copy to main (every normal add-on then offers the update) and makes that GitHub release the latest one (HACS gives its dashboard card).
#   Actions -> "Release to everyone" -> Run workflow (empty: the newest version), or Claude starts it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v, e.g. 5.3.0 (empty = the newest one, the version of the beta)"
        required: false

permissions:
  contents: write
  actions: write                 # starts the workflow Demo afterwards: the demo on GitHub Pages shows the normal add-on (5.3.1)

concurrency:
  group: stable
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copy the version into the normal add-on
        id: copy
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="${INPUT_VERSION:-}"; v="${v#v}"
          [ -n "$v" ] || v="$(sed -n 's/^version: "\(.*\)"/\1/p' floorplan3d/config.yaml)"
          python3 tools/stable.py release "$v"
          python3 tools/stable.py check
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Commit it to main
        env:
          V: ${{ steps.copy.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A floorplan3d-stable
          git commit -m "Release $V to everyone [skip ci]"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            echo "push failed (attempt $i), taking the newest main"; sleep $((i * 5))
            git pull --rebase origin main
          done
          exit 1
      - name: Make its release the latest one
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.copy.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release edit "v$V" --prerelease=false --latest
          else
            echo "::warning::There is no release v$V yet; the workflow Release makes it the latest one when it creates it."
          fi
          echo "### ✅ Version $V is now in the normal add-on" >> "$GITHUB_STEP_SUMMARY"
          echo "Home Assistant offers the update to everyone with the normal add-on (Settings → Apps, or the update notice)." >> "$GITHUB_STEP_SUMMARY"
      - name: The demo on GitHub Pages and in the release shows it too
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run demo.yml --ref main || echo "::warning::Could not start the workflow Demo; start it by hand (Actions, Demo, Run workflow)."
